/* ---------------- Dashboard ---------------- */
const CAT_CHIP_CLASS = { DR: 'cat-dr', Rebuild: 'cat-rebuild', Other: 'cat-other' };

function catBubble(category, count, contentEl, emptyText) {
  const bubble = el('div', { class: 'cat-bubble ' + CAT_CHIP_CLASS[category] });
  const head = el('div', { class: 'cat-bubble-head' });
  const chip = el('span', { class: 'cat-chip ' + CAT_CHIP_CLASS[category] }, [category]);
  head.appendChild(chip);
  head.appendChild(el('span', { class: 'cat-bubble-count mono' }, [String(count)]));
  bubble.appendChild(head);
  if (count === 0) {
    bubble.appendChild(el('div', { class: 'empty-note' }, [emptyText]));
  } else {
    bubble.appendChild(contentEl);
  }
  return bubble;
}

function renderDashboard() {
  const wrap = el('div', { class: 'container' });
  const head = el('div', { class: 'page-head' });
  head.appendChild(el('h1', {}, ['Dashboard']));
  const right = el('div', { style: 'display:flex; align-items:center; gap:10px; flex-wrap:wrap;' });
  const statusBtn = downloadButton('Fleet Status', () => downloadCSV('rolling-stock-status-' + toISODate(todayDateOnly()) + '.csv', buildFleetStatusCSV()));
  if (statusBtn) right.appendChild(statusBtn);
  const dlBtn = downloadButton('Download Schedule', () => downloadCSV('dispatch-schedule-' + toISODate(todayDateOnly()) + '.csv', buildScheduleCSV()));
  if (dlBtn) right.appendChild(dlBtn);
  right.appendChild(el('div', { class: 'today' }, [todayLabel()]));
  head.appendChild(right);
  wrap.appendChild(head);

  // Live-sync indicator: when did statuses last come from the sheet itself?
  if (state.rsSync.status === 'ok' && state.rsSync.at) {
    wrap.appendChild(el('div', { class: 'src-note', style: 'margin: -10px 0 14px;' },
      ['Rolling Stock statuses synced from the spreadsheet at ' + new Date(state.rsSync.at).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) + '. Press Refresh to sync again.']));
  } else if (state.rsSync.status === 'error') {
    wrap.appendChild(el('div', { class: 'src-note', style: 'margin: -10px 0 14px;' }, [state.rsSync.message]));
  }

  const today = toISODate(todayDateOnly());

  // Status carried over from the Rolling Stock sheet's own STATUS column.
  // A unit the sheet marks Assigned / Deployed / Out of Service is listed in
  // its category even when no booking exists on this board — annotated so
  // it's clear the status came from the sheet, not from a dispatch here.
  const SHEET_NOTE = 'Status Provided By Rolling Stock Spreadsheet';
  const VEHICLE_KINDS = ['truck', 'trailer', 'equipment'];
  const KIND_WORD = { truck: 'Truck', trailer: 'Trailer', equipment: 'Equipment' };
  function sheetStatusOf(a) { return a.sheetStatus || 'Available'; }
  const sheetDeployedByCat = {}, sheetAssignedByCat = {};
  CATEGORIES.forEach(cat => {
    const vehicles = VEHICLE_KINDS.flatMap(k => assetsOfKind(k))
      .filter(a => (a.category || 'Other') === cat && !a.outOfService && currentAssetStatus(a).code === 'available');
    sheetDeployedByCat[cat] = vehicles.filter(a => sheetBucket(sheetStatusOf(a)) === 'deployed');
    sheetAssignedByCat[cat] = vehicles.filter(a => sheetBucket(sheetStatusOf(a)) === 'assigned');
  });

  const allTrucks = assetsOfKind('truck');
  const availableByCat = {}, trucksByCat = {};
  CATEGORIES.forEach(cat => {
    trucksByCat[cat] = allTrucks.filter(t => t.category === cat);
    // A truck the Rolling Stock sheet marks Assigned/Deployed isn't offered
    // as available even when it has no booking on this board.
    availableByCat[cat] = trucksByCat[cat].filter(t => currentAssetStatus(t).code === 'available' && sheetBucket(sheetStatusOf(t)) === 'available');
  });
  const deployedByCat = {}, futureByCat = {};
  CATEGORIES.forEach(cat => {
    const catAssignments = state.assignments.filter(a => categoryForAssignment(a) === cat);
    deployedByCat[cat] = catAssignments.filter(a => a.deployDate <= today && today <= a.returnDate)
      .sort((a,b) => a.returnDate.localeCompare(b.returnDate));
    futureByCat[cat] = catAssignments.filter(a => a.deployDate > today)
      .sort((a,b) => a.deployDate.localeCompare(b.deployDate));
  });
  const totalAvailable = CATEGORIES.reduce((n,c) => n + availableByCat[c].length, 0);
  const totalDeployed = CATEGORIES.reduce((n,c) => n + deployedByCat[c].length + sheetDeployedByCat[c].length, 0);
  const totalFuture = CATEGORIES.reduce((n,c) => n + futureByCat[c].length + sheetAssignedByCat[c].length, 0);

  // Rows for units whose non-available status comes from the sheet alone.
  // The pill shows the sheet's own word (Staff, Assigned, Deployed, …).
  function sheetStatusList(assets, pillClass) {
    const listEl = el('div', { class: 'asset-list', style: 'margin-top: 10px; max-height: 260px;' });
    assets.forEach(a => {
      const row = el('div', { class: 'asset-row' });
      const left = el('span', {}, [
        el('span', { class: 'label' }, [a.label]),
        document.createTextNode(a.description ? ' — ' + a.description : ''),
        el('span', { class: 'src-note' }, [SHEET_NOTE]),
      ]);
      row.appendChild(left);
      const right = el('span', { style: 'display: flex; align-items: center; gap: 10px; flex: none;' });
      right.appendChild(el('span', { style: 'font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-faint);' }, [KIND_WORD[a.kind] || a.kind]));
      right.appendChild(el('span', { class: 'pill ' + pillClass }, [el('span', { class: 'dot' }), sheetStatusOf(a)]));
      row.appendChild(right);
      listEl.appendChild(row);
    });
    return listEl;
  }

  // Out of service: every kind — trucks, trailers, and equipment.
  const oosByCat = {};
  CATEGORIES.forEach(cat => {
    oosByCat[cat] = ['truck', 'trailer', 'equipment']
      .flatMap(k => assetsOfKind(k).filter(a => a.category === cat && a.outOfService));
  });
  const totalOOS = CATEGORIES.reduce((n,c) => n + oosByCat[c].length, 0);

  // stat strip (whole fleet)
  const stats = el('div', { class: 'stats' });
  stats.appendChild(statCard('Trucks Available', totalAvailable, 'accent'));
  stats.appendChild(statCard('Currently Deployed', totalDeployed, 'dep'));
  stats.appendChild(statCard('Scheduled', totalFuture, 'future'));
  stats.appendChild(statCard('Out of Service', totalOOS, 'oos'));
  wrap.appendChild(stats);

  /* ---- Available Trucks: one search box, three category bubbles ---- */
  const truckCard = el('div', { class: 'card' });
  const th = el('div', { class: 'card-head' });
  th.appendChild(el('h2', {}, ['Available Trucks']));
  th.appendChild(el('span', { class: 'count' }, [totalAvailable + ' of ' + allTrucks.length]));
  truckCard.appendChild(th);
  const tb = el('div', { class: 'card-body' });
  const searchWrap = el('div', { class: 'searchbox' });
  searchWrap.innerHTML = icon('search', 15);
  const input = el('input', { type: 'text', placeholder: 'Search trucks…' });
  searchWrap.appendChild(input);
  tb.appendChild(searchWrap);
  const bubblesHost = el('div', { class: 'cat-bubbles' });
  tb.appendChild(bubblesHost);
  truckCard.appendChild(tb);
  wrap.appendChild(truckCard);

  function truckList(trucks) {
    const listEl = el('div', { class: 'asset-list', style: 'margin-top: 0; max-height: 260px;' });
    trucks.forEach(t => {
      const row = el('div', { class: 'asset-row' });
      row.appendChild(el('span', {}, [el('span', { class: 'label' }, [t.label]), document.createTextNode(t.description ? ' — ' + t.description : '')]));
      row.appendChild(el('span', { class: 'pill available' }, [el('span', { class: 'dot' }), 'Available']));
      listEl.appendChild(row);
    });
    return listEl;
  }

  function paintTruckBubbles(q) {
    bubblesHost.innerHTML = '';
    q = (q || '').trim().toLowerCase();
    CATEGORIES.forEach(cat => {
      const filtered = availableByCat[cat].filter(t => !q || t.label.toLowerCase().includes(q) || (t.description||'').toLowerCase().includes(q) || t.number.toLowerCase().includes(q));
      const emptyText = q ? 'No available ' + cat + ' trucks match “' + q + '”.' : 'No ' + cat + ' trucks are currently available.';
      bubblesHost.appendChild(catBubble(cat, filtered.length, truckList(filtered), emptyText));
    });
  }
  input.addEventListener('input', () => paintTruckBubbles(input.value));
  paintTruckBubbles('');

  /* ---- Currently Deployed: three category bubbles ---- */
  const depCard = el('div', { class: 'card' });
  const dh = el('div', { class: 'card-head' });
  dh.appendChild(el('h2', {}, ['Currently Deployed']));
  dh.appendChild(el('span', { class: 'count' }, [String(totalDeployed)]));
  depCard.appendChild(dh);
  const db2 = el('div', { class: 'card-body' });
  const depBubbles = el('div', { class: 'cat-bubbles' });
  CATEGORIES.forEach(cat => {
    const combined = el('div');
    if (deployedByCat[cat].length) combined.appendChild(assignmentTable(deployedByCat[cat], { showSinceForReturn: true }));
    if (sheetDeployedByCat[cat].length) combined.appendChild(sheetStatusList(sheetDeployedByCat[cat], 'deployed'));
    depBubbles.appendChild(catBubble(cat, deployedByCat[cat].length + sheetDeployedByCat[cat].length,
      combined, 'No ' + cat + ' assignments are deployed right now.'));
  });
  db2.appendChild(depBubbles);
  depCard.appendChild(db2);
  wrap.appendChild(depCard);

  /* ---- Scheduled (future) deployments: three category bubbles.
     A scheduled trip moves to Currently Deployed on its departure date —
     the buckets are recomputed from today's date on every render, and the
     midnight rollover timer below re-renders a tab left open overnight. ---- */
  const futCard = el('div', { class: 'card' });
  const fh = el('div', { class: 'card-head' });
  fh.appendChild(el('h2', {}, ['Scheduled Deployments']));
  fh.appendChild(el('span', { class: 'count' }, [String(totalFuture)]));
  futCard.appendChild(fh);
  const fb = el('div', { class: 'card-body' });
  const futBubbles = el('div', { class: 'cat-bubbles' });
  CATEGORIES.forEach(cat => {
    const combined = el('div');
    if (futureByCat[cat].length) combined.appendChild(assignmentTable(futureByCat[cat], { showDeployForReturn: true }));
    if (sheetAssignedByCat[cat].length) combined.appendChild(sheetStatusList(sheetAssignedByCat[cat], 'future'));
    futBubbles.appendChild(catBubble(cat, futureByCat[cat].length + sheetAssignedByCat[cat].length,
      combined, 'No upcoming ' + cat + ' deployments are scheduled.'));
  });
  fb.appendChild(futBubbles);
  futCard.appendChild(fb);
  wrap.appendChild(futCard);

  /* ---- Return Trips: auto-created with every booking; assign the
     driver and trip date whenever they're known. ---- */
  const rtRows = [];
  state.assignments.filter(a => a.returnDate && a.returnDate >= today).forEach(a => {
    returnTripsOf(a).forEach(t => { if (!t.checkedIn) rtRows.push({ a, t }); });
  });
  rtRows.sort((x, y) => (x.t.date || x.a.returnDate).localeCompare(y.t.date || y.a.returnDate));
  const rtPending = rtRows.filter(r => !(r.t.driverId && r.t.date)).length;
  const rtCard = el('div', { class: 'card' });
  const rth = el('div', { class: 'card-head' });
  rth.appendChild(el('h2', {}, ['Return Trips']));
  rth.appendChild(el('span', { class: 'count' }, [rtPending ? rtPending + ' need scheduling' : String(rtRows.length)]));
  rtCard.appendChild(rth);
  const rtb = el('div', { class: 'card-body pad-0' });
  if (rtRows.length === 0) {
    rtb.appendChild(el('div', { class: 'empty-note', style: 'padding:18px 20px;' },
      ['No active or upcoming deployments — return trips appear here automatically when something is booked.']));
  } else {
    const scroller = el('div', { class: 'table-scroll' });
    const table = el('table', { class: 'sched' });
    const thead = el('thead');
    const trh = el('tr');
    ['Deployment','Return Of','Truck','Deployment Return','Trip Driver','Trip Date','Status'].forEach(h => trh.appendChild(el('th', {}, [h])));
    thead.appendChild(trh); table.appendChild(thead);
    const tbody = el('tbody');
    rtRows.forEach(r => {
      const a = r.a, t = r.t;
      const tr = el('tr', { onclick: () => { state.route = 'edit'; state.editingId = a.id; render(); } });
      const rtDepTd = el('td', { class: 'deployment' }, [a.deploymentName]);
      const rtCdlBadge = cdlBadgeEl(a);
      if (rtCdlBadge) { rtDepTd.appendChild(document.createTextNode(' ')); rtDepTd.appendChild(rtCdlBadge); }
      tr.appendChild(rtDepTd);
      const ofTd = el('td');
      ofTd.appendChild(document.createTextNode(returnTripScopeLabel(a, t)));
      const remains = (t.scope === 'trailer' && a.trailerRemains) || (t.scope === 'equipment' && a.equipmentRemains);
      if (remains) ofTd.appendChild(el('span', { class: 'src-note' }, ['Remains on scene']));
      tr.appendChild(ofTd);
      tr.appendChild(el('td', {}, [labelOf(a.truckId)]));
      tr.appendChild(el('td', { class: 'mono' }, [fmtShort(a.returnDate)]));
      tr.appendChild(el('td', {}, [t.driverId ? labelOf(t.driverId) : '—']));
      tr.appendChild(el('td', { class: 'mono' }, [t.date ? fmtShort(t.date) : '—']));
      const stTd = el('td');
      let pillCls, pillLabel;
      if (t.driverId && t.date) { pillCls = 'available'; pillLabel = 'Scheduled'; }
      else if (t.driverId) { pillCls = 'deployed'; pillLabel = 'Needs Date'; }
      else if (t.date) { pillCls = 'deployed'; pillLabel = 'Needs Driver'; }
      else { pillCls = 'deployed'; pillLabel = 'Needs Driver & Date'; }
      stTd.appendChild(el('span', { class: 'pill ' + pillCls }, [el('span', { class: 'dot' }), pillLabel]));
      tr.appendChild(stTd);
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    scroller.appendChild(table);
    rtb.appendChild(scroller);
  }
  rtCard.appendChild(rtb);
  wrap.appendChild(rtCard);

  /* ---- Returns Due: on the day a return happens, check the returning
     trailer/equipment back in as Available or Out of Service. ---- */
  const dueRows = [];
  state.assignments.forEach(a => {
    returnTripsOf(a).forEach(t => {
      if (t.checkedIn) return;
      const dueDate = t.date || a.returnDate || '';
      if (dueDate && dueDate <= today) dueRows.push({ a, t, dueDate });
    });
  });
  dueRows.sort((x, y) => x.dueDate.localeCompare(y.dueDate));
  const dueCard = el('div', { class: 'card' });
  const dueH = el('div', { class: 'card-head' });
  dueH.appendChild(el('h2', {}, ['Returns Due — Check In']));
  dueH.appendChild(el('span', { class: 'count' }, [String(dueRows.length)]));
  dueCard.appendChild(dueH);
  const dueB = el('div', { class: 'card-body pad-0' });
  if (dueRows.length === 0) {
    dueB.appendChild(el('div', { class: 'empty-note', style: 'padding:18px 20px;' },
      ['Nothing is due back today. When a return date arrives, its trailer or equipment appears here to be checked in as Available or Out of Service.']));
  } else {
    const scroller = el('div', { class: 'table-scroll' });
    const table = el('table', { class: 'sched' });
    const thead = el('thead');
    const trh = el('tr');
    ['Deployment','Returning','Due','Trip Driver','Check In As'].forEach(h => trh.appendChild(el('th', {}, [h])));
    thead.appendChild(trh); table.appendChild(thead);
    const tbody = el('tbody');
    dueRows.forEach(r => {
      const a = r.a, t = r.t;
      const tr = el('tr', { style: 'cursor: default;' });
      tr.appendChild(el('td', { class: 'deployment' }, [a.deploymentName]));
      tr.appendChild(el('td', {}, [returnAssetsForScope(a, t.scope).map(labelOf).join(', ') || returnTripScopeLabel(a, t)]));
      tr.appendChild(el('td', { class: 'mono' }, [fmtShort(r.dueDate)]));
      tr.appendChild(el('td', {}, [t.driverId ? labelOf(t.driverId) : '—']));
      const actTd = el('td');
      const actWrap = el('span', { style: 'display: inline-flex; gap: 8px;' });
      const okBtn = el('button', { class: 'btn secondary', type: 'button', style: 'padding: 5px 12px; font-size: 12.5px;' }, ['Available']);
      okBtn.addEventListener('click', (e) => { e.stopPropagation(); checkInReturn(a, t.scope, 'Available'); });
      const oosBtn = el('button', { class: 'btn danger', type: 'button', style: 'padding: 5px 12px; font-size: 12.5px;' }, ['Out of Service']);
      oosBtn.addEventListener('click', (e) => { e.stopPropagation(); checkInReturn(a, t.scope, 'Out of Service'); });
      actWrap.appendChild(okBtn); actWrap.appendChild(oosBtn);
      actTd.appendChild(actWrap);
      tr.appendChild(actTd);
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    scroller.appendChild(table);
    dueB.appendChild(scroller);
  }
  dueCard.appendChild(dueB);
  wrap.appendChild(dueCard);

  /* ---- Out of Service: trucks, trailers, and equipment ---- */
  const oosCard = el('div', { class: 'card' });
  const oh = el('div', { class: 'card-head' });
  oh.appendChild(el('h2', {}, ['Out of Service']));
  oh.appendChild(el('span', { class: 'count' }, [String(totalOOS)]));
  oosCard.appendChild(oh);
  const ob = el('div', { class: 'card-body' });
  const oosBubbles = el('div', { class: 'cat-bubbles' });
  CATEGORIES.forEach(cat => {
    const list = el('div', { class: 'asset-list', style: 'margin-top: 0; max-height: 300px;' });
    oosByCat[cat].forEach(a => {
      const row = el('div', { class: 'asset-row' });
      const leftBits = [el('span', { class: 'label' }, [a.label]), document.createTextNode(a.description ? ' — ' + a.description : '')];
      if (!a.writeIn && a.statusSource !== 'board') leftBits.push(el('span', { class: 'src-note' }, [SHEET_NOTE]));
      else if (a.statusSource === 'board') leftBits.push(el('span', { class: 'src-note' }, ['Checked in Out of Service on this board']));
      row.appendChild(el('span', {}, leftBits));
      const right = el('span', { style: 'display: flex; align-items: center; gap: 10px; flex: none;' });
      right.appendChild(el('span', { style: 'font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-faint);' }, [KIND_WORD[a.kind] || a.kind]));
      right.appendChild(el('span', { class: 'pill oos' }, [el('span', { class: 'dot' }), 'Out of Service']));
      row.appendChild(right);
      list.appendChild(row);
    });
    oosBubbles.appendChild(catBubble(cat, oosByCat[cat].length, list, 'No ' + cat + ' units are out of service.'));
  });
  ob.appendChild(oosBubbles);
  oosCard.appendChild(ob);
  wrap.appendChild(oosCard);

  return wrap;
}

function statCard(label, value, cls) {
  const c = el('div', { class: 'stat' + (cls ? ' ' + cls : '') });
  c.appendChild(el('div', { class: 'label' }, [label]));
  c.appendChild(el('div', { class: 'value mono' }, [String(value)]));
  return c;
}

// An assignment's scheduling category: Rebuild wins if ANY vehicle in the
// booking is a Rebuild item (the rebuild trailers are the defining marker —
// Rebuild owns no trucks, so a rebuild run always borrows a DR/Other truck
// and a truck-first rule would never say Rebuild). Otherwise it follows the
// truck, then trailer, then equipment. Falls back to Other so nothing goes
// unlisted.
function categoryForAssignment(a) {
  const assets = [a.truckId, a.trailerId, a.equipmentId].filter(Boolean).map(assetById).filter(Boolean);
  if (assets.some(x => x.category === 'Rebuild')) return 'Rebuild';
  for (const x of assets) { if (x.category) return x.category; }
  return 'Other';
}

function hasB2BFlag(assignment) {
  const ids = [assignment.trailerId, assignment.truckId, assignment.equipmentId, assignment.driverId].filter(Boolean);
  for (const id of ids) {
    const asset = assetById(id);
    if (!asset) continue;
    const warns = backToBackWarningsFor(asset, assignment.deployDate, assignment.returnDate, assignment.id);
    if (warns.length) return true;
  }
  return false;
}

function sectionTable(title, rows, opts) {
  opts = opts || {};
  const card = el('div', { class: 'card' });
  const head = el('div', { class: 'card-head' });
  head.appendChild(el('h2', {}, [title]));
  head.appendChild(el('span', { class: 'count' }, [String(rows.length)]));
  card.appendChild(head);
  const body = el('div', { class: 'card-body pad-0' });
  if (rows.length === 0) {
    body.appendChild(el('div', { class: 'empty-note', style: 'padding:18px 20px;' }, ['Nothing here right now.']));
    card.appendChild(body);
    return card;
  }
  body.appendChild(assignmentTable(rows, opts));
  card.appendChild(body);
  return card;
}

// Bare assignment table (no card wrapper) — shared by the Schedule page's
// full-width cards and the dashboard's per-category bubbles.
function assignmentTable(rows, opts) {
  opts = opts || {};
  const scroller = el('div', { class: 'table-scroll' });
  const table = el('table', { class: 'sched' });
  const thead = el('thead');
  const trh = el('tr');
  ['Deployment','Trailer','Truck','Equipment','Driver','Return','Notes'].forEach(h => trh.appendChild(el('th', {}, [h])));
  thead.appendChild(trh); table.appendChild(thead);
  const tbody = el('tbody');
  rows.forEach(a => {
    const tr = el('tr', { onclick: () => { state.route = 'edit'; state.editingId = a.id; render(); } });
    const trailer = assetById(a.trailerId), truck = assetById(a.truckId), equip = a.equipmentId ? assetById(a.equipmentId) : null, driver = assetById(a.driverId);
    const b2b = hasB2BFlag(a);

    const depCell = el('td', { class: 'deployment' }, [a.deploymentName]);
    if (b2b) {
      const flag = document.createElement('span');
      flag.className = 'b2b-flag';
      flag.innerHTML = icon('warn', 12) + 'B2B';
      depCell.appendChild(flag);
    }
    // CDL-A designation never disappears — it flips to "satisfied".
    const cdlBadge = cdlBadgeEl(a);
    if (cdlBadge) { depCell.appendChild(document.createTextNode(' ')); depCell.appendChild(cdlBadge); }
    tr.appendChild(depCell);
    tr.appendChild(el('td', {}, [trailer ? trailer.label : '—']));
    tr.appendChild(el('td', {}, [truck ? truck.label : '—']));
    tr.appendChild(el('td', {}, [equip ? equip.label : '—']));
    tr.appendChild(el('td', {}, [driver ? driver.label : '—']));

    const retTd = el('td', { class: 'mono' }, [fmtShort(a.returnDate)]);
    if (opts.showSinceForReturn) retTd.appendChild(el('span', { class: 'sub' }, ['since ' + fmtShort(a.deployDate)]));
    if (opts.showDeployForReturn) retTd.appendChild(el('span', { class: 'sub' }, ['departs ' + fmtShort(a.deployDate)]));
    tr.appendChild(retTd);

    tr.appendChild(el('td', { class: 'notes' }, [a.notes || '—']));
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  scroller.appendChild(table);
  return scroller;
}

/* ---------------- Schedule ---------------- */
function renderSchedule() {
  const wrap = el('div', { class: 'container' });
  const head = el('div', { class: 'page-head' });
  head.appendChild(el('h1', {}, ['Schedule']));
  const right = el('div', { style: 'display:flex; align-items:center; gap:14px;' });
  const dlBtn = downloadButton('Download Schedule', () => downloadCSV('dispatch-schedule-' + toISODate(todayDateOnly()) + '.csv', buildScheduleCSV()));
  if (dlBtn) right.appendChild(dlBtn);
  right.appendChild(el('div', { class: 'today' }, [todayLabel()]));
  head.appendChild(right);
  wrap.appendChild(head);

  const today = toISODate(todayDateOnly());
  const deployedNow = state.assignments.filter(a => a.deployDate <= today && today <= a.returnDate).sort((a,b)=>a.returnDate.localeCompare(b.returnDate));
  const upcoming = state.assignments.filter(a => a.deployDate > today).sort((a,b)=>a.deployDate.localeCompare(b.deployDate));

  wrap.appendChild(sectionTable('Deployed Now', deployedNow, { showSinceForReturn: true }));
  wrap.appendChild(sectionTable('Scheduled Next', upcoming, { showDeployForReturn: true }));

  return wrap;
}

/* ---------------- Booking log ---------------- */
function renderLog() {
  const wrap = el('div', { class: 'container' });
  const head = el('div', { class: 'page-head' });
  head.appendChild(el('h1', {}, ['Booking Log']));
  const right = el('div', { style: 'display:flex; align-items:center; gap:14px;' });
  if (state.log.length) {
    const dlBtn = downloadButton('Download Log', () => downloadCSV('booking-log-' + toISODate(todayDateOnly()) + '.csv', buildLogCSV()));
    if (dlBtn) right.appendChild(dlBtn);
  }
  right.appendChild(el('div', { class: 'today' }, [todayLabel()]));
  head.appendChild(right);
  wrap.appendChild(head);

  const card = el('div', { class: 'card' });
  const ch = el('div', { class: 'card-head' });
  ch.appendChild(el('h2', {}, ['All bookings & cancellations']));
  ch.appendChild(el('span', { class: 'count' }, [String(state.log.length)]));
  card.appendChild(ch);
  const body = el('div', { class: 'card-body pad-0' });

  if (state.log.length === 0) {
    body.appendChild(el('div', { class: 'empty-note', style: 'padding:18px 20px;' }, ['No booking activity yet. Entries appear here whenever an assignment is booked, updated, or canceled.']));
    card.appendChild(body);
    wrap.appendChild(card);
    return wrap;
  }

  const scroller = el('div', { class: 'table-scroll' });
  const table = el('table', { class: 'sched' });
  const thead = el('thead');
  const trh = el('tr');
  ['When','Action','Deployment','Trailer','Truck','Equipment','Driver','Departure','Return'].forEach(h => trh.appendChild(el('th', {}, [h])));
  thead.appendChild(trh); table.appendChild(thead);
  const tbody = el('tbody');
  const ACTION_PILL = { Booked: 'available', Updated: 'future', Canceled: 'oos', 'Return Scheduled': 'future', Returned: 'available' };
  state.log.forEach(e => {
    const tr = el('tr', { style: 'cursor: default;' });
    const when = new Date(e.at);
    const whenTd = el('td', { class: 'mono' }, [when.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })]);
    whenTd.appendChild(el('span', { class: 'sub' }, [when.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })]));
    tr.appendChild(whenTd);
    const actTd = el('td');
    actTd.appendChild(el('span', { class: 'pill ' + (ACTION_PILL[e.action] || 'future') }, [el('span', { class: 'dot' }), e.action]));
    tr.appendChild(actTd);
    tr.appendChild(el('td', { class: 'deployment' }, [e.deploymentName || '—']));
    tr.appendChild(el('td', {}, [e.trailer || '—']));
    tr.appendChild(el('td', {}, [e.truck || '—']));
    tr.appendChild(el('td', {}, [e.equipment || '—']));
    tr.appendChild(el('td', {}, [e.driver || '—']));
    tr.appendChild(el('td', { class: 'mono' }, [fmtShort(e.deployDate)]));
    tr.appendChild(el('td', { class: 'mono' }, [fmtShort(e.returnDate)]));
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  scroller.appendChild(table);
  body.appendChild(scroller);
  card.appendChild(body);
  wrap.appendChild(card);
  return wrap;
}

/* ---------------- Assignment form (New + Edit) ---------------- */
function blankRT() { return { all: { driverId: null, date: '' }, trailer: { driverId: null, date: '' }, equipment: { driverId: null, date: '' } }; }
function blankBlock() {
  return { key: uid('blk'), trailerId: null, truckId: null, equipmentId: null, driverId: null, deployDate: toISODate(todayDateOnly()), returnDate: '', notes: '', trailerRemains: false, equipmentRemains: false, rt: blankRT(), loadedWeight: null, _cdlWarned: '' };
}

function renderAssignmentForm(mode) {
  const isEdit = mode === 'edit';
  const existing = isEdit ? state.assignments.find(a => a.id === state.editingId) : null;
  if (isEdit && !existing) {
    const wrap = el('div', { class: 'container' });
    wrap.appendChild(el('div', { class: 'card' }, [el('div', { class: 'card-body' }, ['That assignment no longer exists.'])]));
    return wrap;
  }

  const formState = {
    deploymentName: isEdit ? existing.deploymentName : '',
    blocks: isEdit ? [{
      key: existing.id, trailerId: existing.trailerId, truckId: existing.truckId, equipmentId: existing.equipmentId,
      driverId: existing.driverId, deployDate: existing.deployDate, returnDate: existing.returnDate, notes: existing.notes || '',
      trailerRemains: !!existing.trailerRemains, equipmentRemains: !!existing.equipmentRemains,
      loadedWeight: existing.loadedWeight || null, _cdlWarned: '',
      rt: (function () {
        const rt = blankRT();
        returnTripsOf(existing).forEach(t => { if (rt[t.scope]) rt[t.scope] = { driverId: t.driverId || null, date: t.date || '' }; });
        return rt;
      })(),
    }] : [blankBlock()],
    deploymentId: isEdit ? existing.deploymentId : uid('dep'),
  };

  const wrap = el('div', { class: 'container' });
  const head = el('div', { class: 'page-head' });
  head.appendChild(el('h1', {}, [isEdit ? 'Edit Assignment' : 'New Assignment']));
  wrap.appendChild(head);

  const errorHost = el('div');
  wrap.appendChild(errorHost);

  const card = el('div', { class: 'card' });
  const body = el('div', { class: 'card-body' });

  // Deployment name
  const depField = el('div', { class: 'field' });
  depField.appendChild(el('label', {}, ['Deployment']));
  const depInput = el('input', { type: 'text', placeholder: 'e.g. Ross Fire, Illinois Response', value: formState.deploymentName });
  depInput.addEventListener('input', () => { formState.deploymentName = depInput.value; });
  depField.appendChild(depInput);
  body.appendChild(depField);

  const blocksHost = el('div');
  body.appendChild(blocksHost);

  function paintBlocks() {
    blocksHost.innerHTML = '';
    formState.blocks.forEach((blk, idx) => blocksHost.appendChild(renderBlock(blk, idx)));
  }

  function renderBlock(blk, idx) {
    const b = el('div', { class: 'assign-block' });
    const bh = el('div', { class: 'assign-block-head' });
    bh.appendChild(el('div', { class: 'tag' }, [formState.blocks.length > 1 ? ('Assignment ' + (idx+1)) : 'Assignment']));
    if (formState.blocks.length > 1) {
      const rm = el('button', { class: 'btn ghost', type: 'button', onclick: () => { formState.blocks.splice(idx,1); paintBlocks(); } });
      rm.innerHTML = icon('x', 14) + '<span>Remove</span>';
      bh.appendChild(rm);
    }
    b.appendChild(bh);

    const g2 = el('div', { class: 'grid-2' });

    // Clicked filter chips per field (this assignment block only).
    const filterSel = { trailer: new Set(), truck: new Set() };
    function filterChips(kind) {
      const row = el('div', { class: 'filter-chips' });
      VEHICLE_FILTERS[kind].forEach(d => {
        const chip = el('button', { class: 'fchip', type: 'button', 'aria-pressed': 'false' }, [d.label]);
        chip.addEventListener('click', () => {
          if (filterSel[kind].has(d.key)) filterSel[kind].delete(d.key);
          else filterSel[kind].add(d.key);
          chip.classList.toggle('on');
          chip.setAttribute('aria-pressed', chip.classList.contains('on') ? 'true' : 'false');
          paintCombos(); // remount so the dropdown reflects the filter
        });
        row.appendChild(chip);
      });
      return row;
    }

    // Trailer combo
    const trailerField = el('div', { class: 'field' });
    trailerField.appendChild(el('label', {}, ['Trailer']));
    trailerField.appendChild(filterChips('trailer'));
    const trailerHost = el('div', { 'data-field': 'trailer' });
    trailerField.appendChild(trailerHost);
    const trailerRemainsWrap = el('label', { class: 'remain-check' });
    const trailerRemainsCb = el('input', { type: 'checkbox' });
    trailerRemainsCb.checked = !!blk.trailerRemains;
    trailerRemainsCb.addEventListener('change', () => { blk.trailerRemains = trailerRemainsCb.checked; paintReturnTrips(); });
    trailerRemainsWrap.appendChild(trailerRemainsCb);
    trailerRemainsWrap.appendChild(document.createTextNode('Trailer remains on scene'));
    trailerField.appendChild(trailerRemainsWrap);
    g2.appendChild(trailerField);

    // Truck combo
    const truckField = el('div', { class: 'field' });
    truckField.appendChild(el('label', {}, ['Truck']));
    truckField.appendChild(filterChips('truck'));
    const truckHost = el('div', { 'data-field': 'truck' });
    truckField.appendChild(truckHost);
    g2.appendChild(truckField);
    b.appendChild(g2);

    // Tow compatibility + CDL-A panel: appears once a trailer and truck
    // are both chosen.
    const compatHost = el('div', { 'data-compat': '1' });
    b.appendChild(compatHost);

    function paintCompat() {
      compatHost.innerHTML = '';
      const trailer = blk.trailerId ? assetById(blk.trailerId) : null;
      const truck = blk.truckId ? assetById(blk.truckId) : null;
      if (!trailer || !truck) return;
      const c = blockCompat();
      const box = el('div', { class: 'compat ' + c.status });
      const HEAD = { green: 'GREEN — COMPATIBLE', yellow: 'YELLOW — VERIFICATION REQUIRED', red: 'RED — INCOMPATIBLE' };
      box.appendChild(el('b', {}, [HEAD[c.status] || '']));
      c.reasons.forEach(r => box.appendChild(el('span', { class: 'sub' }, [r])));
      if (c.cap.value != null && c.weight.value != null) {
        box.appendChild(el('span', { class: 'sub' }, [
          'Tow reserve: ' + fmtLb(c.reserve) + ' (' + truck.label + ' capacity ' + fmtLb(c.cap.value) +
          (c.cap.source === 'verified' ? ' verified' : ' TXM ' + truckClassWord(truckClassOf(truck)) + ' default') +
          ' − ' + trailer.label + ' ' + fmtLb(c.weight.value) + (c.weight.source === 'entered' ? ' actual loaded' : ' GVWR') + ')']));
      }
      if (c.combined != null) {
        box.appendChild(el('span', { class: 'sub' }, [
          'Combination rated weight: ' + fmtLb(truckGvwrOf(truck).value) + ' + ' + fmtLb(trailer.gvwr) + ' = ' + fmtLb(c.combined) +
          (c.combinedProvisional ? ' (truck GVWR estimated by class — enter the verified GVWR in Rolling Stock)' : '') +
          (c.cdlRequired ? ' — CDL-A REQUIRED' : '')]));
      }
      // Actual loaded trailer weight (empty + equipment + attachments +
      // fuel + cargo) — overrides GVWR when entered.
      const wtWrap = el('span', { class: 'setcap' });
      wtWrap.appendChild(document.createTextNode('Actual loaded trailer weight:'));
      const wtInput = el('input', { type: 'number', min: '0', step: '50', placeholder: trailer.gvwr ? String(trailer.gvwr) : 'lb', value: blk.loadedWeight || '' });
      wtInput.addEventListener('change', () => { blk.loadedWeight = parseInt(wtInput.value, 10) || null; paintCompat(); });
      wtWrap.appendChild(wtInput);
      wtWrap.appendChild(document.createTextNode('lb'));
      box.appendChild(wtWrap);
      // Fleet-manager verified tow capacity replaces the class default.
      if (c.cap.source !== 'verified') {
        const capWrap = el('span', { class: 'setcap' });
        capWrap.appendChild(document.createTextNode('Verified tow capacity for ' + truck.label + ':'));
        const capInput = el('input', { type: 'number', min: '0', step: '100', placeholder: 'lb' });
        const capBtn = el('button', { class: 'btn secondary', type: 'button' }, ['Save']);
        capBtn.addEventListener('click', async () => {
          const v = parseInt(capInput.value, 10);
          if (!v) return;
          truck.towCapacity = v;
          truck.towCapacitySource = 'verified';
          if (state.db) { try { await state.db.doc('assets/' + truck.id).set(truck); } catch (e) {} }
          showToast(truck.label + ' verified tow capacity set to ' + fmtLb(v) + '.');
          paintCompat();
        });
        capWrap.appendChild(capInput); capWrap.appendChild(document.createTextNode('lb'));
        capWrap.appendChild(capBtn);
        box.appendChild(capWrap);
      }
      compatHost.appendChild(box);
      // CDL-A pop-up: fires once per truck+trailer pairing, before driver
      // selection, with no dismiss-and-continue option.
      if (c.cdlRequired) {
        const key = blk.trailerId + '|' + blk.truckId;
        if (blk._cdlWarned !== key) {
          blk._cdlWarned = key;
          showCdlModal(truck, trailer, c);
        }
      }
    }

    const g2b = el('div', { class: 'grid-2' });
    // Equipment combo (optional)
    const equipField = el('div', { class: 'field' });
    equipField.appendChild(el('label', {}, ['Equipment ', el('span', { class: 'hint' }, ['(optional)'])]));
    const equipHost = el('div', { 'data-field': 'equipment' });
    equipField.appendChild(equipHost);
    const equipRemainsWrap = el('label', { class: 'remain-check' });
    const equipRemainsCb = el('input', { type: 'checkbox' });
    equipRemainsCb.checked = !!blk.equipmentRemains;
    equipRemainsCb.addEventListener('change', () => { blk.equipmentRemains = equipRemainsCb.checked; paintReturnTrips(); });
    equipRemainsWrap.appendChild(equipRemainsCb);
    equipRemainsWrap.appendChild(document.createTextNode('Equipment remains on scene'));
    equipField.appendChild(equipRemainsWrap);
    g2b.appendChild(equipField);

    // Driver combo
    const driverField = el('div', { class: 'field' });
    const driverLabel = el('label', {}, ['Driver']);
    driverField.appendChild(driverLabel);
    const driverHost = el('div', { 'data-field': 'driver' });
    driverField.appendChild(driverHost);
    const driverNote = el('div', { class: 'hint', style: 'font-size: 12px; color: var(--oos-fg); margin-top: 6px; display: none;' });
    driverField.appendChild(driverNote);
    g2b.appendChild(driverField);
    b.appendChild(g2b);

    const g3 = el('div', { class: 'grid-2' });
    const deployField = el('div', { class: 'field' });
    deployField.appendChild(el('label', {}, ['Departure Date']));
    const deployInput = el('input', { type: 'date', value: blk.deployDate || '' });
    deployInput.addEventListener('change', () => { blk.deployDate = deployInput.value; paintCombos(); });
    deployField.appendChild(deployInput);
    g3.appendChild(deployField);

    const returnField = el('div', { class: 'field' });
    returnField.appendChild(el('label', {}, ['Return']));
    const returnInput = el('input', { type: 'date', value: blk.returnDate || '' });
    returnInput.addEventListener('change', () => { blk.returnDate = returnInput.value; paintCombos(); });
    returnField.appendChild(returnInput);
    g3.appendChild(returnField);
    b.appendChild(g3);

    // Return trips: auto-created with every booking. Checking "remains on
    // scene" on the trailer or equipment splits the single return into two
    // separate returns, each with its own driver and date — all assignable
    // later from the dashboard's Return Trips section.
    const rtHead = el('div', { class: 'assign-block-head', style: 'margin-top: 4px;' });
    rtHead.appendChild(el('div', { class: 'tag' }, ['Return Trips']));
    b.appendChild(rtHead);
    b.appendChild(el('div', { class: 'hint', style: 'font-size: 12px; color: var(--ink-faint); margin: -2px 0 8px;' },
      ['Scheduled automatically with this booking. Check "remains on scene" above to split the trailer and equipment into two separate returns. Drivers and dates can be assigned now or later.']));
    const rtHost = el('div');
    b.appendChild(rtHost);

    function paintReturnTrips() {
      rtHost.innerHTML = '';
      const scopes = activeReturnScopes(blk);
      scopes.forEach(scope => {
        const name = scope === 'all' ? 'Return Trip'
          : scope === 'trailer' ? 'Trailer Return' + (blk.trailerId ? ' — ' + labelOf(blk.trailerId) : '')
          : 'Equipment Return' + (blk.equipmentId ? ' — ' + labelOf(blk.equipmentId) : '');
        const g = el('div', { class: 'grid-2' });
        const dField = el('div', { class: 'field' });
        dField.appendChild(el('label', {}, [name + ' Driver ', el('span', { class: 'hint' }, ['(assign later if unknown)'])]));
        const dHost = el('div', { 'data-field': 'returnDriver-' + scope });
        dField.appendChild(dHost);
        g.appendChild(dField);
        const dateField = el('div', { class: 'field' });
        dateField.appendChild(el('label', {}, [name + ' Date ', el('span', { class: 'hint' }, ['(assign later if unknown)'])]));
        const dateInput = el('input', { type: 'date', value: blk.rt[scope].date || '' });
        dateInput.addEventListener('change', () => { blk.rt[scope].date = dateInput.value; paintReturnTrips(); });
        dateField.appendChild(dateInput);
        g.appendChild(dateField);
        rtHost.appendChild(g);
        // Availability is judged against this trip's date alone (a one-day
        // window); this assignment itself is excluded so the outbound
        // driver can also drive a return.
        // Towing the trailer home is the same combination — the CDL-A
        // restriction applies to the return driver too (equipment-only
        // returns ride on their own transport and are exempt).
        const rtCdl = scope !== 'equipment' && blockCompat().cdlRequired;
        mountCombo(dHost, {
          value: blk.rt[scope].driverId,
          placeholder: rtCdl ? 'Search CDL-A drivers…' : 'Search driver…',
          getOptions: (q) => comboOptionsFor('driver', q, {
            deployDate: blk.rt[scope].date || null, returnDate: blk.rt[scope].date || null,
            equipmentId: null, excludeAssignmentId: isEdit ? existing.id : null, cdlRequired: rtCdl,
          }),
          renderChosen: (id) => chosenLabel('driver', id),
          onSelect: (id) => { blk.rt[scope].driverId = id; paintReturnTrips(); },
          onCreateWriteIn: (label) => createWriteInAsset('driver', label),
        });
      });
    }

    const notesField = el('div', { class: 'field', style: 'margin-bottom:6px;' });
    notesField.appendChild(el('label', {}, ['Notes']));
    const notesInput = el('textarea', { placeholder: 'Optional' }, [blk.notes || '']);
    notesInput.value = blk.notes || '';
    notesInput.addEventListener('input', () => { blk.notes = notesInput.value; });
    notesField.appendChild(notesInput);
    b.appendChild(notesField);

    function ctx() {
      return {
        deployDate: blk.deployDate, returnDate: blk.returnDate, equipmentId: blk.equipmentId,
        excludeAssignmentId: isEdit ? existing.id : null,
        selectedTrailerId: blk.trailerId, selectedTruckId: blk.truckId,
      };
    }
    function blockCompat() {
      return towCompatFor(blk.trailerId ? assetById(blk.trailerId) : null, blk.truckId ? assetById(blk.truckId) : null, blk.loadedWeight);
    }

    function paintCombos() {
      mountCombo(trailerHost, {
        value: blk.trailerId,
        placeholder: 'Search trailer number…',
        getOptions: (q) => comboOptionsFor('trailer', q, Object.assign(ctx(), { filters: filterSel.trailer })),
        renderChosen: (id) => chosenLabel('trailer', id),
        onSelect: (id) => { blk.trailerId = id; paintCombos(); },
        onCreateWriteIn: (label) => createWriteInAsset('trailer', label),
      });
      mountCombo(truckHost, {
        value: blk.truckId,
        placeholder: 'Search truck number…',
        getOptions: (q) => comboOptionsFor('truck', q, Object.assign(ctx(), { filters: filterSel.truck })),
        renderChosen: (id) => chosenLabel('truck', id),
        onSelect: (id) => { blk.truckId = id; paintCombos(); },
        onCreateWriteIn: (label) => createWriteInAsset('truck', label),
      });
      mountCombo(equipHost, {
        value: blk.equipmentId,
        placeholder: 'Search equipment (optional)…',
        getOptions: (q) => comboOptionsFor('equipment', q, ctx()),
        renderChosen: (id) => chosenLabel('equipment', id),
        onSelect: (id) => { blk.equipmentId = id; paintCombos(); },
        onCreateWriteIn: (label) => createWriteInAsset('equipment', label),
      });
      const cdl = blockCompat().cdlRequired;
      driverLabel.innerHTML = '';
      if (cdl) {
        driverLabel.appendChild(document.createTextNode('Select CDL-A Driver '));
        driverLabel.appendChild(el('span', { class: 'cdl-badge req' }, ['CDL-A REQUIRED']));
      } else {
        driverLabel.textContent = 'Driver';
      }
      mountCombo(driverHost, {
        value: blk.driverId,
        placeholder: cdl ? 'Search CDL-A drivers…' : 'Search driver…',
        getOptions: (q) => comboOptionsFor('driver', q, Object.assign(ctx(), { cdlRequired: cdl })),
        renderChosen: (id) => chosenLabel('driver', id),
        onSelect: (id) => { blk.driverId = id; paintCombos(); },
        onCreateWriteIn: (label) => createWriteInAsset('driver', label),
      });
      if (cdl) {
        const eligible = comboOptionsFor('driver', '', Object.assign(ctx(), { cdlRequired: true }));
        driverNote.style.display = eligible.length ? 'none' : '';
        driverNote.textContent = eligible.length ? '' : 'No available CDL-A driver was found for these dates. Change the vehicle, the trailer, or the dates — this dispatch cannot be completed without a CDL-A driver.';
      } else {
        driverNote.style.display = 'none';
      }
      // Approved-trailer note when equipment is picked
      const approvedNote = b.querySelector('.approved-note');
      if (approvedNote) approvedNote.remove();
      if (blk.equipmentId) {
        const eq = assetById(blk.equipmentId);
        const approved = (eq.approvedTrailerIds || []).map(id => (assetById(id)||{}).label).filter(Boolean);
        if (approved.length) {
          const note = el('div', { class: 'field hint approved-note', style: 'margin:-10px 0 14px;' });
          note.textContent = 'Approved trailers for ' + eq.label + ': ' + approved.join(', ') + '.';
          equipField.appendChild(note);
        }
      }
      // The remain-on-scene checkbox for equipment only matters once
      // equipment is chosen; without it there's nothing to split.
      equipRemainsWrap.style.display = blk.equipmentId ? '' : 'none';
      if (!blk.equipmentId && blk.equipmentRemains) { blk.equipmentRemains = false; equipRemainsCb.checked = false; }
      paintCompat();
      paintReturnTrips();
    }
    paintCombos();

    return b;
  }
  paintBlocks();

  const addBtn = el('button', { class: 'btn secondary', type: 'button', style: 'margin-bottom: 6px;' });
  addBtn.innerHTML = icon('plus', 15) + '<span>Add Another Trailer / Truck</span>';
  addBtn.addEventListener('click', () => { formState.blocks.push(blankBlock()); paintBlocks(); });
  body.appendChild(addBtn);

  card.appendChild(body);
  wrap.appendChild(card);

  // Actions
  const actions = el('div', { class: 'form-actions' });
  const leftActions = el('div');
  if (isEdit) {
    const del = el('button', { class: 'btn danger', type: 'button' });
    del.innerHTML = icon('x', 15) + '<span>Delete Assignment</span>';
    del.addEventListener('click', () => {
      showConfirmModal({
        title: 'Delete this assignment?',
        message: 'This cancels "' + (existing.deploymentName || 'this booking') + '" and cannot be undone. It will be recorded in the Booking Log as a cancellation.',
        confirmLabel: 'Delete & Log Cancellation',
        onConfirm: async () => {
          // Log first, then delete — the cancellation record is written even
          // if the viewer navigates away the instant the row disappears.
          await appendLog('Canceled', existing);
          await deleteAssignmentDoc(existing.id);
          showToast('Assignment canceled and logged.');
          state.route = 'schedule'; state.editingId = null; render();
        },
      });
    });
    leftActions.appendChild(del);
  }
  actions.appendChild(leftActions);
  const rightActions = el('div', { class: 'right' });
  const cancelBtn = el('button', { class: 'btn secondary', type: 'button' }, ['Cancel']);
  cancelBtn.addEventListener('click', () => { state.route = isEdit ? 'schedule' : 'dashboard'; state.editingId = null; render(); });
  rightActions.appendChild(cancelBtn);
  const saveBtn = el('button', { class: 'btn primary', type: 'button' });
  saveBtn.innerHTML = icon('check', 15) + '<span>' + (isEdit ? 'Save Changes' : 'Save Assignment') + '</span>';
  rightActions.appendChild(saveBtn);
  actions.appendChild(rightActions);
  wrap.appendChild(actions);

  saveBtn.addEventListener('click', () => attemptSave());

  function paintErrors(messages) {
    errorHost.innerHTML = '';
    if (!messages.length) return;
    const box = el('div', { class: 'alert error' });
    box.innerHTML = icon('ban', 18);
    const b = el('div', { class: 'body' });
    b.appendChild(el('div', {}, [document.createElement('b')]));
    b.querySelector('b').textContent = 'CANNOT BOOK';
    const ul = el('ul');
    messages.forEach(m => ul.appendChild(el('li', {}, [m])));
    b.appendChild(ul);
    box.appendChild(b);
    errorHost.appendChild(box);
    box.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function attemptSave(skipB2BCheck) {
    const errors = [];
    if (!formState.deploymentName.trim()) errors.push('Enter a deployment name.');
    formState.blocks.forEach((blk, i) => {
      const label = formState.blocks.length > 1 ? 'Assignment ' + (i+1) + ': ' : '';
      if (!blk.trailerId) errors.push(label + 'Choose a trailer.');
      if (!blk.truckId) errors.push(label + 'Choose a truck.');
      if (!blk.driverId) errors.push(label + 'Choose a driver.');
      if (!blk.deployDate) errors.push(label + 'Set a departure date.');
      if (!blk.returnDate) errors.push(label + 'Set a return date.');
      if (blk.deployDate && blk.returnDate && blk.returnDate < blk.deployDate) errors.push(label + 'Return date is before the departure date.');
      activeReturnScopes(blk).forEach(scope => {
        const t = blk.rt[scope];
        const name = scope === 'all' ? 'Return trip' : (scope === 'trailer' ? 'Trailer return' : 'Equipment return');
        if (t.date && blk.deployDate && t.date < blk.deployDate) errors.push(label + name + ' date is before the departure date.');
      });
      // CDL-A required with no driver picked and none eligible: surface the
      // dedicated modal — the dispatch stays incomplete.
      if (!blk.driverId && blk.trailerId && blk.truckId && blk.deployDate && blk.returnDate) {
        const compat = towCompatFor(assetById(blk.trailerId), assetById(blk.truckId), blk.loadedWeight);
        if (compat.cdlRequired) {
          const eligible = comboOptionsFor('driver', '', { deployDate: blk.deployDate, returnDate: blk.returnDate, equipmentId: null, excludeAssignmentId: isEdit ? existing.id : null, cdlRequired: true });
          if (!eligible.length) attemptSave._noCdl = true;
        }
      }
    });
    if (errors.length) {
      paintErrors(errors);
      if (attemptSave._noCdl) { attemptSave._noCdl = false; showNoCdlModal(); }
      return;
    }
    attemptSave._noCdl = false;

    // Hard-stop conflict checks: trailer, truck, equipment, driver — against existing bookings AND sibling blocks in this same save.
    const CHECKED_FIELDS = [['trailerId','Trailer'], ['truckId','Truck'], ['equipmentId','Equipment'], ['driverId','Driver']];
    const conflictMsgs = [];
    const redCompat = [];
    formState.blocks.forEach((blk, i) => {
      const label = formState.blocks.length > 1 ? 'Assignment ' + (i+1) + ' — ' : '';
      CHECKED_FIELDS.forEach(([field, kindLabel]) => {
        const assetId = blk[field];
        if (!assetId) return;
        const asset = assetById(assetId);
        const conflicts = hardConflictsFor(asset, blk.deployDate, blk.returnDate, isEdit ? existing.id : null);
        conflicts.forEach(c => {
          if (c.type === 'oos') conflictMsgs.push(label + asset.label + ' is marked ' + (asset.kind === 'driver' ? 'Unavailable' : 'Out of Service') + '.');
          else conflictMsgs.push(label + asset.label + ' is already assigned to: ' + c.booking.deploymentName + ' — Return Date: ' + fmtLong(c.booking.returnDate) + '.');
        });
      });
      // Return-trip drivers: each must be free on their trip date (this
      // assignment excluded, so the outbound driver can drive a return).
      activeReturnScopes(blk).forEach(scope => {
        const t = blk.rt[scope];
        if (!t.driverId || !t.date) return;
        const rtDriver = assetById(t.driverId);
        const name = scope === 'all' ? 'Return trip driver ' : (scope === 'trailer' ? 'Trailer return driver ' : 'Equipment return driver ');
        hardConflictsFor(rtDriver, t.date, t.date, isEdit ? existing.id : null).forEach(c => {
          if (c.type === 'oos') conflictMsgs.push(label + name + rtDriver.label + ' is marked Unavailable.');
          else conflictMsgs.push(label + name + rtDriver.label + ' is already assigned to: ' + c.booking.deploymentName + ' — Return Date: ' + fmtLong(c.booking.returnDate) + '.');
        });
      });
      // Towing & CDL-A control.
      if (blk.trailerId && blk.truckId) {
        const compat = towCompatFor(assetById(blk.trailerId), assetById(blk.truckId), blk.loadedWeight);
        if (compat.status === 'red' && !attemptSave._redOverridden) {
          redCompat.push({ label, compat });
        }
        if (compat.cdlRequired) {
          if (blk.driverId && !isCdlA(assetById(blk.driverId))) {
            conflictMsgs.push(label + 'This combination (rated ' + fmtLb(compat.combined) + ') requires a CDL Class A driver — ' + labelOf(blk.driverId) + ' is not on file as CDL-A.');
          }
          activeReturnScopes(blk).forEach(scope => {
            if (scope === 'equipment') return;
            const t = blk.rt[scope];
            if (t.driverId && !isCdlA(assetById(t.driverId))) {
              conflictMsgs.push(label + 'The return trip for this CDL-A combination also requires a CDL Class A driver — ' + labelOf(t.driverId) + ' is not on file as CDL-A.');
            }
          });
        }
      }
      // Drivers booked on THIS assignment: also blocked if they're already
      // committed to another assignment's return trip inside this window.
      if (blk.driverId && blk.deployDate && blk.returnDate) {
        state.assignments.forEach(a => {
          if (isEdit && a.id === existing.id) return;
          returnTripsOf(a).forEach(t => {
            if (t.driverId === blk.driverId && t.date &&
                blk.deployDate <= t.date && t.date <= blk.returnDate) {
              conflictMsgs.push(label + labelOf(blk.driverId) + ' is scheduled for the ' + a.deploymentName + ' return trip on ' + fmtLong(t.date) + '.');
            }
          });
        });
      }
      // sibling blocks within this same submission
      formState.blocks.forEach((other, j) => {
        if (j <= i) return;
        CHECKED_FIELDS.forEach(([field]) => {
          if (blk[field] && blk[field] === other[field] && overlapsISO(blk.deployDate, blk.returnDate, other.deployDate, other.returnDate)) {
            const asset = assetById(blk[field]);
            conflictMsgs.push('Assignment ' + (i+1) + ' and Assignment ' + (j+1) + ' both use ' + asset.label + ' on overlapping dates.');
          }
        });
      });
    });
    if (conflictMsgs.length) { paintErrors(conflictMsgs); return; }
    errorHost.innerHTML = '';

    // RED tow compatibility: block, with the authorized manual-override
    // path — an explicit acknowledged override, never a silent pass.
    if (redCompat.length && !attemptSave._redOverridden) {
      showConfirmModal({
        title: 'Incompatible combination',
        message: redCompat.map(r => r.label + r.compat.reasons.join(' ')).join(' ') +
          ' Booking anyway requires an authorized manual override and will be recorded.',
        confirmLabel: 'Authorized Override — Book Anyway',
        onConfirm: () => { attemptSave._redOverridden = true; attemptSave(skipB2BCheck); attemptSave._redOverridden = false; },
      });
      return;
    }

    if (!skipB2BCheck) {
      const warnings = [];
      formState.blocks.forEach((blk, i) => {
        CHECKED_FIELDS.forEach(([field]) => {
          const assetId = blk[field];
          if (!assetId) return;
          const asset = assetById(assetId);
          const warns = backToBackWarningsFor(asset, blk.deployDate, blk.returnDate, isEdit ? existing.id : null);
          warns.forEach(w => warnings.push({ asset, blk, warn: w }));
        });
      });
      if (warnings.length) { showB2BModal(warnings, () => attemptSave(true)); return; }
    }

    doSave();
  }

  async function doSave() {
    if (isEdit) {
      const blk = formState.blocks[0];
      const scopes = activeReturnScopes(blk);
      const returnTrips = scopes.map(s => ({ scope: s, driverId: blk.rt[s].driverId || null, date: blk.rt[s].date || '' }));
      const compatE = towCompatFor(assetById(blk.trailerId), assetById(blk.truckId), blk.loadedWeight);
      const data = {
        deploymentId: existing.deploymentId, deploymentName: formState.deploymentName.trim(),
        trailerId: blk.trailerId, truckId: blk.truckId, equipmentId: blk.equipmentId || null,
        driverId: blk.driverId, deployDate: blk.deployDate, returnDate: blk.returnDate, notes: blk.notes || '',
        trailerRemains: !!blk.trailerRemains, equipmentRemains: !!blk.equipmentRemains,
        loadedWeight: blk.loadedWeight || null,
        cdlRequired: !!compatE.cdlRequired, combinedGvwr: compatE.combined || null,
        returnTrips,
        // legacy flat pair kept in step for anything still reading it
        returnDriverId: scopes[0] === 'all' ? (blk.rt.all.driverId || null) : null,
        returnTripDate: scopes[0] === 'all' ? (blk.rt.all.date || '') : '',
        createdAt: existing.createdAt || Date.now(), updatedAt: Date.now(),
      };
      await saveAssignmentDoc(existing.id, data);
      const oldByScope = {};
      returnTripsOf(existing).forEach(t => { oldByScope[t.scope] = t; });
      let loggedRT = false;
      returnTrips.forEach(t => {
        const old = oldByScope[t.scope] || {};
        if (t.driverId && t.date && (old.driverId !== t.driverId || old.date !== t.date)) {
          const tag = t.scope === 'all' ? '' : ' (' + (t.scope === 'trailer' ? 'trailer' : 'equipment') + ' return)';
          appendLog('Return Scheduled', Object.assign({}, data, { deploymentName: data.deploymentName + tag, driverId: t.driverId, deployDate: t.date, returnDate: t.date }));
          loggedRT = true;
        }
      });
      if (!loggedRT) appendLog('Updated', data);
      showToast('Assignment updated.');
      state.route = 'schedule'; state.editingId = null; render();
    } else {
      for (const blk of formState.blocks) {
        const id = uid('asg');
        const scopes = activeReturnScopes(blk);
        const returnTrips = scopes.map(s => ({ scope: s, driverId: blk.rt[s].driverId || null, date: blk.rt[s].date || '' }));
        const compatN = towCompatFor(assetById(blk.trailerId), assetById(blk.truckId), blk.loadedWeight);
        const data = {
          deploymentId: formState.deploymentId, deploymentName: formState.deploymentName.trim(),
          trailerId: blk.trailerId, truckId: blk.truckId, equipmentId: blk.equipmentId || null,
          driverId: blk.driverId, deployDate: blk.deployDate, returnDate: blk.returnDate, notes: blk.notes || '',
          trailerRemains: !!blk.trailerRemains, equipmentRemains: !!blk.equipmentRemains,
          loadedWeight: blk.loadedWeight || null,
          cdlRequired: !!compatN.cdlRequired, combinedGvwr: compatN.combined || null,
          returnTrips,
          returnDriverId: scopes[0] === 'all' ? (blk.rt.all.driverId || null) : null,
          returnTripDate: scopes[0] === 'all' ? (blk.rt.all.date || '') : '',
          createdAt: Date.now(),
        };
        await saveAssignmentDoc(id, data);
        appendLog('Booked', data);
        returnTrips.forEach(t => {
          if (t.driverId && t.date) {
            const tag = t.scope === 'all' ? '' : ' (' + (t.scope === 'trailer' ? 'trailer' : 'equipment') + ' return)';
            appendLog('Return Scheduled', Object.assign({}, data, { deploymentName: data.deploymentName + tag, driverId: t.driverId, deployDate: t.date, returnDate: t.date }));
          }
        });
      }
      showToast('Assignment saved.');
      state.route = 'dashboard'; state.editingId = null; render();
    }
  }

  return wrap;
}

// CDL-A warning: shown the moment a combination crosses 25,999 lb rated
// weight, before driver selection. Deliberately has NO dismiss-and-continue
// option — the only way forward is CDL-A driver selection.
function showCdlModal(truck, trailer, compat) {
  const overlay = el('div', { class: 'modal-overlay' });
  const modal = el('div', { class: 'modal' });
  const h = el('h3', { style: 'color: var(--oos-fg);' });
  h.innerHTML = icon('warn', 20) + 'CDL-A DRIVER REQUIRED';
  modal.appendChild(h);
  modal.appendChild(el('div', { class: 'lead' }, [
    'This vehicle and trailer combination has a combined rated weight greater than 25,999 lb. Only a driver recorded in the TXM fleet system as CDL Class A may be assigned to this combination.']));
  const facts = el('div', { style: 'font-size: 13.5px; line-height: 1.9; margin: 10px 0;' });
  const row = (k, v) => { const d = el('div'); d.appendChild(el('b', {}, [k + ': '])); d.appendChild(document.createTextNode(v)); return d; };
  facts.appendChild(row('Vehicle', truck.label + (truck.description ? ' — ' + truck.description : '')));
  facts.appendChild(row('Vehicle GVWR', fmtLb(truckGvwrOf(truck).value) + (truckGvwrOf(truck).provisional ? ' (class estimate)' : '')));
  facts.appendChild(row('Trailer', trailer.label + (trailer.description ? ' — ' + trailer.description : '')));
  facts.appendChild(row('Trailer GVWR', fmtLb(trailer.gvwr)));
  facts.appendChild(row('Combined Rated Weight', fmtLb(compat.combined)));
  facts.appendChild(row('Required Driver Qualification', 'CDL CLASS A'));
  modal.appendChild(facts);
  const actions = el('div', { class: 'modal-actions' });
  const goBtn = el('button', { class: 'btn primary' }, ['Continue to CDL-A Driver Selection']);
  goBtn.addEventListener('click', () => overlay.remove());
  actions.appendChild(goBtn);
  modal.appendChild(actions);
  overlay.appendChild(modal);
  // No overlay-click dismiss on purpose.
  document.body.appendChild(overlay);
}

// No eligible CDL-A driver: the dispatch stays incomplete — there is no
// normal-completion path around this.
function showNoCdlModal() {
  const overlay = el('div', { class: 'modal-overlay' });
  const modal = el('div', { class: 'modal' });
  const h = el('h3', { style: 'color: var(--oos-fg);' });
  h.innerHTML = icon('warn', 20) + 'NO QUALIFIED CDL-A DRIVER AVAILABLE';
  modal.appendChild(h);
  modal.appendChild(el('div', { class: 'lead' }, [
    'This combination requires a CDL-A driver, but no currently available CDL-A driver was found. The dispatch stays incomplete until an eligible driver is selected — change the vehicle, the trailer, or the dates.']));
  const listHost = el('div', { style: 'display: none; font-size: 13px; line-height: 1.8; margin: 8px 0; max-height: 180px; overflow-y: auto;' });
  const cdlAll = assetsOfKind('driver').filter(isCdlA);
  listHost.appendChild(el('b', {}, ['CDL-A drivers on the approved list:']));
  cdlAll.forEach(d => listHost.appendChild(el('div', {}, [d.label + ' — ' + (d.description || 'CDL-A')])));
  if (!cdlAll.length) listHost.appendChild(el('div', {}, ['None on file.']));
  modal.appendChild(listHost);
  const actions = el('div', { class: 'modal-actions' });
  const viewBtn = el('button', { class: 'btn secondary' }, ['View CDL-A Drivers']);
  viewBtn.addEventListener('click', () => { listHost.style.display = listHost.style.display === 'none' ? '' : 'none'; });
  const vehBtn = el('button', { class: 'btn secondary' }, ['Change Vehicle']);
  vehBtn.addEventListener('click', () => overlay.remove());
  const trBtn = el('button', { class: 'btn secondary' }, ['Change Trailer']);
  trBtn.addEventListener('click', () => overlay.remove());
  actions.appendChild(viewBtn); actions.appendChild(vehBtn); actions.appendChild(trBtn);
  modal.appendChild(actions);
  overlay.appendChild(modal);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
}

// In-page confirmation. The artifact viewer runs this page in a sandboxed
// frame where the browser's native confirm() is blocked and silently
// returns false — which made the Delete button look dead. Never use
// confirm()/alert()/prompt() here; this modal is the replacement.
function showConfirmModal(opts) {
  const overlay = el('div', { class: 'modal-overlay' });
  const modal = el('div', { class: 'modal' });
  const h = el('h3', { style: 'color: var(--oos-fg);' });
  h.innerHTML = icon('warn', 20) + opts.title;
  modal.appendChild(h);
  modal.appendChild(el('div', { class: 'lead' }, [opts.message]));
  const actions = el('div', { class: 'modal-actions' });
  const cancel = el('button', { class: 'btn secondary' }, ['Go Back']);
  cancel.addEventListener('click', () => overlay.remove());
  const confirmBtn = el('button', { class: 'btn danger-solid' }, [opts.confirmLabel]);
  confirmBtn.addEventListener('click', () => { overlay.remove(); opts.onConfirm(); });
  actions.appendChild(cancel); actions.appendChild(confirmBtn);
  modal.appendChild(actions);
  overlay.appendChild(modal);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
}

function showB2BModal(warnings, onContinue) {
  const overlay = el('div', { class: 'modal-overlay' });
  const modal = el('div', { class: 'modal' });
  const h = el('h3', {});
  h.innerHTML = icon('warn', 20) + 'Back-to-Back Booking Warning';
  modal.appendChild(h);
  modal.appendChild(el('div', { class: 'lead' }, ['Review the timing below, then confirm the assets can be turned around in time.']));
  warnings.forEach(w => {
    const item = el('div', { class: 'conflict-item' });
    const gapText = w.warn.gap === 0 ? 'the same day' : (w.warn.gap + ' day later');
    let msg;
    if (w.warn.direction === 'after') {
      msg = w.asset.label + ' returns ' + fmtLong(w.warn.booking.returnDate) + ' and is scheduled again ' + fmtLong(w.blk.deployDate) + ' (' + gapText + ').';
    } else {
      msg = w.asset.label + ' returns ' + fmtLong(w.blk.returnDate) + ' and is scheduled again ' + fmtLong(w.warn.booking.deployDate) + ' (' + gapText + ').';
    }
    item.appendChild(el('div', { class: 'who' }, [w.asset.label]));
    item.appendChild(el('div', {}, [msg]));
    item.appendChild(el('div', { class: 'hint', style: 'margin-top:6px;' }, ['Verify there is enough time to return, unload, inspect, prepare, and redeploy.']));
    modal.appendChild(item);
  });
  const actions = el('div', { class: 'modal-actions' });
  const back = el('button', { class: 'btn secondary' }, ['Go Back']);
  back.addEventListener('click', () => overlay.remove());
  const cont = el('button', { class: 'btn primary' }, ['Acknowledge & Save']);
  cont.addEventListener('click', () => { overlay.remove(); onContinue(); });
  actions.appendChild(back); actions.appendChild(cont);
  modal.appendChild(actions);
  overlay.appendChild(modal);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
}

function showToast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const t = el('div', { class: 'toast' });
  t.innerHTML = icon('check', 15) + '<span>' + msg + '</span>';
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

/* =====================================================================
   ROOT RENDER
   ===================================================================== */
function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const shell = el('div', { class: 'shell' });
  shell.appendChild(renderNav());
  const main = el('div', { class: 'main' });

  if (!state.ready) {
    const loading = el('div', { class: 'container' }, [el('div', { class: 'placeholder-note' }, ['Loading dispatch board…'])]);
    main.appendChild(loading);
  } else if (state.route === 'dashboard') {
    main.appendChild(renderDashboard());
  } else if (state.route === 'log') {
    main.appendChild(renderLog());
  } else if (state.route === 'schedule') {
    main.appendChild(renderSchedule());
  } else if (state.route === 'new') {
    main.appendChild(renderAssignmentForm('new'));
  } else if (state.route === 'edit') {
    main.appendChild(renderAssignmentForm('edit'));
  }
  shell.appendChild(main);
  app.appendChild(shell);
}

render();
initData();

// Date rollover: the dashboard buckets (Scheduled → Currently Deployed,
// Returns Due) are computed from today's date at render time, but a tab
// left open overnight would keep showing yesterday's view until some data
// arrived. Watch the local calendar and re-render the moment the date
// changes — this is what moves a scheduled trip to Deployed on its
// departure date without anyone touching anything.
let lastRenderedDay = toISODate(todayDateOnly());
setInterval(() => {
  const d = toISODate(todayDateOnly());
  if (d !== lastRenderedDay) {
    lastRenderedDay = d;
    if (state.route !== 'new' && state.route !== 'edit') render();
  }
}, 60000);
</script>
