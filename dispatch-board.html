<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dispatch Board</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --page:          #f3f4f0;
    --surface:       #ffffff;
    --surface-2:     #eceee8;
    --ink:           #1a221e;
    --ink-muted:     #5c655e;
    --ink-faint:     #8b938a;
    --border:        rgba(24,32,28,0.12);
    --border-strong: rgba(24,32,28,0.20);

    --accent:        #2b5c62;
    --accent-ink:    #ffffff;
    --accent-wash:   rgba(43,92,98,0.10);
    --accent-wash-2: rgba(43,92,98,0.18);

    --ok-fg:   #1b7a48;
    --ok-bg:   rgba(27,122,72,0.12);
    --future-fg: #33509e;
    --future-bg: rgba(51,80,158,0.11);
    --dep-fg:  #a3660c;
    --dep-bg:  rgba(163,102,12,0.14);
    --oos-fg:  #a1332b;
    --oos-bg:  rgba(161,51,43,0.12);

    --shadow-sm: 0 1px 2px rgba(20,26,22,0.06);
    --shadow-md: 0 6px 20px rgba(20,26,22,0.10);
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page:          #141815;
      --surface:       #1c211d;
      --surface-2:     #242a25;
      --ink:           #eef1ec;
      --ink-muted:     #a6ada4;
      --ink-faint:     #757d74;
      --border:        rgba(238,241,236,0.12);
      --border-strong: rgba(238,241,236,0.22);

      --accent:        #7fc2c9;
      --accent-ink:    #0c1817;
      --accent-wash:   rgba(127,194,201,0.13);
      --accent-wash-2: rgba(127,194,201,0.22);

      --ok-fg:   #6fd39c;
      --ok-bg:   rgba(111,211,156,0.14);
      --future-fg: #9db2ef;
      --future-bg: rgba(157,178,239,0.14);
      --dep-fg:  #f0b458;
      --dep-bg:  rgba(240,180,88,0.16);
      --oos-fg:  #f19086;
      --oos-bg:  rgba(241,144,134,0.14);

      --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
      --shadow-md: 0 10px 30px rgba(0,0,0,0.45);
    }
  }
  :root[data-theme="dark"] {
    --page:          #141815;
    --surface:       #1c211d;
    --surface-2:     #242a25;
    --ink:           #eef1ec;
    --ink-muted:     #a6ada4;
    --ink-faint:     #757d74;
    --border:        rgba(238,241,236,0.12);
    --border-strong: rgba(238,241,236,0.22);

    --accent:        #7fc2c9;
    --accent-ink:    #0c1817;
    --accent-wash:   rgba(127,194,201,0.13);
    --accent-wash-2: rgba(127,194,201,0.22);

    --ok-fg:   #6fd39c;
    --ok-bg:   rgba(111,211,156,0.14);
    --future-fg: #9db2ef;
    --future-bg: rgba(157,178,239,0.14);
    --dep-fg:  #f0b458;
    --dep-bg:  rgba(240,180,88,0.16);
    --oos-fg:  #f19086;
    --oos-bg:  rgba(241,144,134,0.14);

    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-md: 0 10px 30px rgba(0,0,0,0.45);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: 'Public Sans', system-ui, -apple-system, sans-serif;
    font-size: 14.5px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .display {
    font-family: 'Barlow Semi Condensed', system-ui, sans-serif;
    font-weight: 700;
    text-wrap: balance;
    margin: 0;
  }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  a { color: inherit; }
  button { font-family: inherit; }
  ::selection { background: var(--accent-wash-2); }

  .shell { display: flex; min-height: 100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 232px;
    flex: 0 0 232px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 22px 16px;
    position: sticky;
    top: 0;
    height: 100vh;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 8px 22px;
  }
  .brand .mark {
    width: 30px; height: 30px; border-radius: 7px;
    background: var(--accent); color: var(--accent-ink);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 700; font-size: 16px;
    flex: none;
  }
  .brand .name { font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 700; font-size: 17px; line-height: 1.1; }
  .brand .sub { color: var(--ink-faint); font-size: 11px; letter-spacing: .03em; text-transform: uppercase; margin-top: 2px; }

  .nav { display: flex; flex-direction: column; gap: 3px; }
  .nav button {
    all: unset;
    cursor: pointer;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-muted);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .nav button:hover { background: var(--surface-2); color: var(--ink); }
  .nav button.active { background: var(--accent-wash); color: var(--accent); }
  .nav button .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .55; flex: none; }
  .nav-primary { margin-top: 8px; }
  .nav button.cta {
    margin-top: 14px;
    background: var(--accent);
    color: var(--accent-ink);
    justify-content: center;
  }
  .nav button.cta:hover { filter: brightness(1.06); }

  .sidebar-foot {
    margin-top: auto;
    padding: 10px 8px 2px;
    font-size: 11.5px;
    color: var(--ink-faint);
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok-fg); flex: none; }
  .sync-dot.off { background: var(--ink-faint); }
  .refresh-btn {
    all: unset; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-top: auto; margin-bottom: 10px;
    padding: 9px 12px; border-radius: 8px;
    border: 1px solid var(--border-strong);
    font-size: 13px; font-weight: 600; color: var(--ink-muted);
  }
  .refresh-btn:hover { background: var(--surface-2); color: var(--ink); }
  .refresh-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .refresh-btn[disabled] { opacity: .55; cursor: default; }
  @media (prefers-reduced-motion: no-preference) {
    .refresh-btn.spinning svg { animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  }

  /* ---------- Main ---------- */
  .main { flex: 1; min-width: 0; }
  .container { max-width: 1080px; margin: 0 auto; padding: 34px 36px 80px; }
  .page-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .page-head h1 { font-size: 28px; }
  .page-head .today { color: var(--ink-muted); font-size: 13.5px; }

  /* Category bubbles: DR / Rebuild / Other sub-groups inside each section */
  .cat-bubbles { display: flex; flex-direction: column; gap: 14px; margin-top: 14px; }
  .cat-bubble {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 13px 15px 15px;
    background: var(--surface-2);
  }
  .cat-bubble-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cat-bubble-count { font-size: 12px; color: var(--ink-faint); }
  .cat-chip {
    display: inline-flex; align-items: center;
    font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 700; font-size: 13.5px;
    letter-spacing: .04em; text-transform: uppercase;
    padding: 3px 12px; border-radius: 999px;
  }
  .cat-chip.cat-dr      { background: var(--accent-wash-2); color: var(--accent); }
  .cat-chip.cat-rebuild { background: var(--dep-bg); color: var(--dep-fg); }
  .cat-chip.cat-other   { background: var(--future-bg); color: var(--future-fg); }
  .cat-bubble .empty-note { padding: 2px 2px 0; }
  .cat-bubble .asset-row { background: var(--surface); }
  .cat-bubble table.sched th { background: var(--surface-2); }
  .cat-bubble table.sched tbody tr:hover td { background: var(--accent-wash); }

  /* ---------- Cards ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
  }
  .card + .card { margin-top: 18px; }
  .card-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  .card-head h2 { font-size: 18px; }
  .card-head .count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-muted);
    background: var(--surface-2);
    padding: 2px 8px;
    border-radius: 999px;
  }
  .card-body { padding: 18px 20px; }
  .card-body.pad-0 { padding: 0; }

  /* ---------- Stat strip ---------- */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  @media (max-width: 900px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow-sm);
  }
  .stat .label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-faint); font-weight: 600; }
  .stat .value { font-family: 'Barlow Semi Condensed', sans-serif; font-size: 30px; font-weight: 700; margin-top: 3px; }
  .stat.accent .value { color: var(--accent); }
  .stat.dep .value { color: var(--dep-fg); }
  .stat.future .value { color: var(--future-fg); }
  .stat.oos .value { color: var(--oos-fg); }

  /* ---------- Search box ---------- */
  .searchbox { position: relative; }
  .searchbox input[type="text"] {
    width: 100%;
    font: inherit;
    font-size: 14px;
    padding: 9px 12px 9px 34px;
    border-radius: 8px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--ink);
  }
  .searchbox input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .searchbox svg.icn { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--ink-faint); pointer-events: none; }

  .asset-list { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; max-height: 340px; overflow-y: auto; }
  .asset-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13.5px;
  }
  .asset-row .label { font-weight: 600; }
  .asset-row .desc { color: var(--ink-muted); font-weight: 400; }
  .empty-note { color: var(--ink-faint); font-size: 13px; padding: 10px 2px; }
  .src-note { display: block; font-size: 11px; font-style: italic; color: var(--ink-faint); margin-top: 2px; }
  .cdl-badge {
    display: inline-block; font-size: 10.5px; font-weight: 800; letter-spacing: .05em;
    padding: 2px 8px; border-radius: 5px; text-transform: uppercase; white-space: nowrap;
  }
  .cdl-badge.req { background: var(--oos-bg); color: var(--oos-fg); border: 1px solid var(--oos-fg); }
  .cdl-badge.ok { background: var(--ok-bg); color: var(--ok-fg); border: 1px solid var(--ok-fg); }
  .compat { border-radius: 8px; padding: 10px 14px; margin: 2px 0 14px; font-size: 13px; line-height: 1.5; border: 1px solid; }
  .compat b { font-weight: 800; letter-spacing: .03em; }
  .compat.green { background: var(--ok-bg); color: var(--ok-fg); border-color: var(--ok-fg); }
  .compat.yellow { background: var(--dep-bg); color: var(--dep-fg); border-color: var(--dep-fg); }
  .compat.red { background: var(--oos-bg); color: var(--oos-fg); border-color: var(--oos-fg); }
  .compat .sub { display: block; font-size: 12px; opacity: .9; }
  .compat .setcap { display: inline-flex; gap: 6px; align-items: center; margin-top: 6px; }
  .compat .setcap input { width: 110px; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink); font: inherit; font-size: 12.5px; }
  .compat .setcap button { font-size: 12px; padding: 4px 10px; }
  .remain-check {
    display: flex; align-items: center; gap: 7px; margin-top: 7px; cursor: pointer;
    font-size: 12.5px !important; font-weight: 500 !important; text-transform: none !important;
    letter-spacing: 0 !important; color: var(--ink-muted) !important;
  }
  .remain-check input { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; margin: 0; flex: none; }
  .filter-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
  .fchip {
    font-size: 11.5px; font-weight: 600; letter-spacing: .01em;
    padding: 4px 11px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--border-strong); background: var(--surface);
    color: var(--ink-muted); transition: all .12s ease;
  }
  .fchip:hover { border-color: var(--accent); color: var(--accent); }
  .fchip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  /* ---------- Status pill ---------- */
  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11.5px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase;
    padding: 3px 9px; border-radius: 999px; white-space: nowrap;
  }
  .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.available { color: var(--ok-fg); background: var(--ok-bg); }
  .pill.future    { color: var(--future-fg); background: var(--future-bg); }
  .pill.deployed  { color: var(--dep-fg); background: var(--dep-bg); }
  .pill.oos       { color: var(--oos-fg); background: var(--oos-bg); }

  /* ---------- Table ---------- */
  .table-scroll { overflow-x: auto; }
  table.sched { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.sched th, table.sched td { text-align: left; padding: 10px 14px; white-space: nowrap; border-bottom: 1px solid var(--border); vertical-align: top; }
  table.sched th {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-faint);
    font-weight: 700; position: sticky; top: 0; background: var(--surface);
  }
  table.sched tbody tr { cursor: pointer; }
  table.sched tbody tr:hover td { background: var(--surface-2); }
  table.sched td.notes { white-space: normal; max-width: 240px; color: var(--ink-muted); }
  table.sched td .sub { display: block; color: var(--ink-faint); font-size: 11.5px; margin-top: 2px; }
  table.sched td.deployment { font-weight: 700; }
  .b2b-flag {
    display: inline-flex; align-items: center; gap: 4px;
    color: var(--dep-fg); font-size: 11px; font-weight: 700;
    margin-left: 6px;
  }

  /* ---------- Buttons ---------- */
  .btn {
    all: unset;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    font-size: 13.5px; font-weight: 600;
    padding: 9px 16px;
    border-radius: 8px;
    border: 1px solid transparent;
  }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { filter: brightness(1.07); }
  .btn.secondary { background: var(--surface); border-color: var(--border-strong); color: var(--ink); }
  .btn.secondary:hover { background: var(--surface-2); }
  .btn.ghost { color: var(--ink-muted); padding: 9px 10px; }
  .btn.ghost:hover { color: var(--ink); background: var(--surface-2); }
  .btn.danger { color: var(--oos-fg); }
  .btn.danger-solid { background: var(--oos-fg); color: #ffffff; }
  .btn.danger-solid:hover { filter: brightness(1.08); }
  .btn.danger:hover { background: var(--oos-bg); }
  .btn.block { width: 100%; }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }

  /* ---------- Forms ---------- */
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .field label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-muted); }
  .field .hint { font-size: 11.5px; color: var(--ink-faint); font-weight: 400; text-transform: none; letter-spacing: 0; }
  .field input[type="text"], .field input[type="date"], .field textarea {
    font: inherit; font-size: 14px;
    padding: 9px 11px;
    border-radius: 8px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--ink);
    width: 100%;
  }
  .field input:focus, .field textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .field textarea { resize: vertical; min-height: 60px; font-family: inherit; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  @media (max-width: 720px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

  /* ---------- Combo (searchable dropdown) ---------- */
  .combo { position: relative; }
  .combo-input {
    display: flex; align-items: center; gap: 8px;
    width: 100%;
    padding: 9px 11px;
    border-radius: 8px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    cursor: text;
  }
  .combo-input.open { border-color: var(--accent); }
  .combo-input input { all: unset; flex: 1; min-width: 0; font: inherit; font-size: 14px; color: var(--ink); }
  .combo-input .chosen-pill { font-size: 12px; font-weight: 700; color: var(--ink-faint); }
  .combo-input .clear-btn { all: unset; cursor: pointer; color: var(--ink-faint); padding: 2px; display: flex; }
  .combo-input .clear-btn:hover { color: var(--ink); }
  .combo-panel {
    position: absolute; z-index: 40; left: 0; right: 0; top: calc(100% + 6px);
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    box-shadow: var(--shadow-md);
    max-height: 280px;
    overflow-y: auto;
    padding: 6px;
  }
  .combo-opt {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 9px 10px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13.5px;
  }
  .combo-opt:hover, .combo-opt.hi { background: var(--accent-wash); }
  .combo-opt.disabled { cursor: not-allowed; opacity: .55; }
  .combo-opt.disabled:hover { background: transparent; }
  .combo-opt .left { min-width: 0; }
  .combo-opt .name { font-weight: 700; }
  .combo-opt .meta { color: var(--ink-muted); font-size: 12px; margin-top: 1px; }
  .combo-opt .badge { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; padding: 2px 7px; border-radius: 999px; background: var(--accent-wash); color: var(--accent); flex: none; }
  .combo-opt.writein { border-top: 1px solid var(--border); margin-top: 4px; padding-top: 10px; }
  .combo-opt.writein .name { color: var(--accent); }
  .combo-opt.writein .name::before { content: "+ "; }
  .combo-empty { padding: 14px 10px; color: var(--ink-faint); font-size: 13px; }

  /* ---------- Assignment block ---------- */
  .assign-block {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 18px 4px;
    margin-bottom: 16px;
    background: var(--surface-2);
  }
  .assign-block-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .assign-block-head .tag {
    font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 700; font-size: 15px; color: var(--ink-muted);
  }

  /* ---------- Alerts / banners ---------- */
  .alert {
    border-radius: 9px;
    padding: 13px 15px;
    font-size: 13.5px;
    display: flex; gap: 10px; align-items: flex-start;
    margin-bottom: 14px;
  }
  .alert .icn { flex: none; margin-top: 1px; }
  .alert.error { background: var(--oos-bg); color: var(--oos-fg); }
  .alert.warn { background: var(--dep-bg); color: var(--dep-fg); }
  .alert b { font-weight: 700; }
  .alert .body { color: var(--ink); }
  .alert ul { margin: 6px 0 0; padding-left: 18px; }

  /* ---------- Modal ---------- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(10,14,12,.45);
    display: flex; align-items: center; justify-content: center; padding: 20px;
    z-index: 100;
  }
  .modal {
    background: var(--surface);

function uid(prefix) {
  return prefix + '_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
}

function todayDateOnly() {
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}
function toISODate(d) {
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return y + '-' + m + '-' + day;
}
function fromISODate(iso) {
  const [y,m,d] = iso.split('-').map(Number);
  return new Date(y, m-1, d);
}
function addDays(iso, n) {
  const d = fromISODate(iso);
  d.setDate(d.getDate()+n);
  return toISODate(d);
}
function fmtShort(iso) {
  if (!iso) return '';
  const d = fromISODate(iso);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}
function fmtLong(iso) {
  if (!iso) return '';
  const d = fromISODate(iso);
  return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
}
function daysBetweenISO(aIso, bIso) {
  return Math.round((fromISODate(bIso).getTime() - fromISODate(aIso).getTime()) / 86400000);
}
function overlapsISO(d1,r1,d2,r2) {
  return fromISODate(d1).getTime() <= fromISODate(r2).getTime() && fromISODate(d2).getTime() <= fromISODate(r1).getTime();
}

// Bump when the shape/source of the reference data above changes — drives
// the one-time migration in initData() that replaces stale seeded assets
// (and clears demo/stale assignments that pointed at them).
const SEED_DATA_VERSION = 7;

function slugify(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, ''); }

function assetsOfRollingStockKind(kind) {
  return ROLLING_STOCK_ASSETS.filter(r => r.kind === kind).map(r => ({
    id: kind + '_' + slugify(r.unit),
    kind, number: r.unit, label: r.unit, description: r.description,
    category: r.category, outOfService: !!r.oos,
    sheetStatus: r.status || 'Available',
    model: r.m || '', comments: r.c || '',
    hitchType: r.hitch || '', emptyWeight: r.ew || null, gvwr: r.gvwr || null,
    ...(kind === 'truck' ? { gooseneckCapable: /gooseneck|goose neck|\bgn\b/i.test(r.hitch || ''), towCapacity: null } : {}),
    ...(kind === 'equipment' ? { approvedTrailerIds: [] } : {}),
  }));
}
function buildTrailerAssets() { return assetsOfRollingStockKind('trailer'); }
function buildTruckAssets() { return assetsOfRollingStockKind('truck'); }
function buildEquipmentAssets() { return assetsOfRollingStockKind('equipment'); }
function buildDriverAssets() {
  return APPROVED_DRIVERS.map((d, i) => ({
    id: 'driver_' + i + '_' + slugify(d.last),
    kind: 'driver', number: '', label: (d.first + ' ' + d.last).trim(),
    description: d.cls ? 'License Class ' + d.cls : '', outOfService: false,
    cls: d.cls || '',
  }));
}
function buildSeedAssets() {
  return [...buildTrailerAssets(), ...buildTruckAssets(), ...buildEquipmentAssets(), ...buildDriverAssets()];
}

/* -------------------- DB wiring -------------------- */
let unsubAssets = null, unsubAssignments = null, unsubLog = null;

// Re-render on data arrival — but never while the viewer is inside the
// New/Edit Assignment form: render() rebuilds the whole view, so a snapshot
// landing mid-form would wipe everything typed. The form reads
// state.assets/state.assignments live at interaction time, so conflict
// checks still see fresh data without a rebuild.
function snapshotRender() {
  if (state.route === 'new' || state.route === 'edit') return;
  render();
}

// Guarded state updates. The assets collection can NEVER legitimately be
// empty (the seeded reference fleet always exists), so an empty delivery is
// always a degraded read — a cache-only snapshot while a slept tab
// reconnects, or a read over a dead bridge — and must not wipe good data
// off the screen. Assignments and the log CAN legitimately be empty, so an
// empty delivery is accepted only when it is server-definitive
// (not fromCache) or nothing was held locally anyway.
function acceptAssets(docs) {
  if (docs.length === 0 && state.assets.length > 0) return false;
  state.assets = docs.map(d => ({ id: d.id, ...d.data() }));
  return true;
}
function definitive(snapOrNull) {
  return !snapOrNull || !snapOrNull.metadata || snapOrNull.metadata.fromCache === false;
}
function acceptAssignments(docs, snap) {
  if (docs.length === 0 && state.assignments.length > 0 && !definitive(snap)) return false;
  state.assignments = docs.map(d => ({ id: d.id, ...d.data() }));
  return true;
}
function acceptLog(docs, snap) {
  if (docs.length === 0 && state.log.length > 0 && !definitive(snap)) return false;
  state.log = docs.map(d => ({ id: d.id, ...d.data() }));
  return true;
}

function attachSubscriptions(db) {
  try { if (unsubAssets) unsubAssets(); } catch (e) {}
  try { if (unsubAssignments) unsubAssignments(); } catch (e) {}
  try { if (unsubLog) unsubLog(); } catch (e) {}

  unsubAssets = db.collection('assets').onSnapshot(snap => {
    acceptAssets(snap.docs);
    state.ready = true;
    snapshotRender();
  }, () => {});

  unsubAssignments = db.collection('assignments').onSnapshot(snap => {
    acceptAssignments(snap.docs, snap);
    state.ready = true;
    snapshotRender();
  }, () => {});

  unsubLog = db.collection('log').orderBy('at', 'desc').limit(500).onSnapshot(snap => {
    acceptLog(snap.docs, snap);
    snapshotRender();
  }, () => {});
}

async function initData() {
  let db = null;
  try { db = await claude.use('db'); } catch (e) { db = null; }

  // Downloads capability resolves independently; the Download buttons only
  // appear once (and if) it lands, so nothing here blocks first render.
  try {
    claude.use('downloads').then(d => { if (d) { state.downloads = d; render(); } }).catch(() => {});
  } catch (e) { /* no capability runtime in this view */ }
  // Google Drive bridge (mcp): once it lands, pull live statuses from the
  // Rolling Stock sheet. Resolves independently; nothing blocks first render.
  try {
    claude.use('mcp').then(m => { if (m) { state.mcp = m; syncRollingStock(); } }).catch(() => {});
  } catch (e) { /* no capability runtime in this view */ }
  state.db = db;

  if (!db) {
    // No db capability available in this view — run on local in-memory data.
    state.assets = buildSeedAssets();
    state.assignments = [];
    state.ready = true;
    render();
    return;
  }

  // Subscribe first so the page renders with whatever is already in the
  // store — even mid-migration, even stale — instead of sitting on the
  // loading placeholder until a (possibly slow) migration finishes below.
  attachSubscriptions(db);

  // Belt-and-suspenders: a brand-new store with nothing to deliver yet
  // (first-ever open, before seeding writes anything) could otherwise leave
  // the page on the loading placeholder indefinitely. Force it open.
  setTimeout(() => { if (!state.ready) { state.ready = true; render(); } }, 4000);

  try {
    await runMigrationIfNeeded(db);
  } catch (e) { /* seeding/migration is best-effort */ }
}

// Writes `items` through `fn` in small concurrent batches instead of one
// await per item — the version this replaced serialized ~150 individual
// round trips (16 trucks + 4 equipment + 130 drivers) before the page had
// rendered anything, which is what made the dashboard look stuck loading.
// allSettled so one slow/failed write in a batch doesn't stall the rest.
async function writeInBatches(items, fn, batchSize) {
  batchSize = batchSize || 10;
  for (let i = 0; i < items.length; i += batchSize) {
    await Promise.allSettled(items.slice(i, i + batchSize).map(fn));
  }
}

async function runMigrationIfNeeded(db) {
  const metaRef = db.doc('meta/seed');
  const metaSnap = await metaRef.get();
  let seededVersion;
  if (metaSnap.exists) {
    seededVersion = metaSnap.data().version || 0;
  } else {
    // No version marker: distinguish a truly empty store (fresh install)
    // from an older install that was seeded before this marker existed.
    const anyAsset = await db.collection('assets').limit(1).get();
    seededVersion = anyAsset.empty ? 0 : 1;
  }
  if (seededVersion >= SEED_DATA_VERSION) return;

  if (seededVersion < 1) {
    // Fresh install — nothing to clean up, just write the full reference set.
    await writeInBatches(buildSeedAssets(), a => db.doc('assets/' + a.id).set(a));
  } else if (seededVersion >= 3) {
    // v3+ upgrades refresh reference fields on the same Rolling Stock
    // assets (identical ids). In-place upsert that PRESERVES anything the
    // fleet manager verified by hand (towCapacity, statusSource) — no
    // deletions, and existing assignments stay untouched. Assets added by
    // a live sheet sync (synced: true) aren't in the seed and are left alone.
    const existingSnap = await db.collection('assets').get();
    const existingById = {};
    existingSnap.docs.forEach(d => { existingById[d.id] = d.data(); });
    await writeInBatches(buildSeedAssets(), a => {
      const prev = existingById[a.id];
      if (prev) {
        if (prev.towCapacity != null) a.towCapacity = prev.towCapacity;
        if (prev.statusSource) { a.statusSource = prev.statusSource; if (prev.statusSource === 'board') { a.sheetStatus = prev.sheetStatus; a.outOfService = prev.outOfService; } }
      }
      return db.doc('assets/' + a.id).set(a);
    });
  } else {
    // Existing install running an older reference set (mock data, or the
    // earlier Fleet-Management-sourced trucks/equipment with mock
    // trailers) — replace trailers, trucks, equipment, and drivers with the
    // Rolling-Stock-sourced set. Anything a dispatcher wrote in by hand
    // (asset.writeIn) is real data, not stale seed data, so it's kept.
    // Assignments referencing the old ids no longer resolve, so they're
    // cleared too.
    const staleSnap = await db.collection('assets').where('kind', 'in', ['trailer', 'truck', 'equipment', 'driver']).get();
    const staleDocs = staleSnap.docs.filter(d => !d.data().writeIn);
    await writeInBatches(staleDocs, d => db.doc('assets/' + d.id).delete());
    const assignSnap = await db.collection('assignments').get();
    await writeInBatches(assignSnap.docs, d => db.doc('assignments/' + d.id).delete());
    await writeInBatches(buildSeedAssets(), a => db.doc('assets/' + a.id).set(a));
  }
  await metaRef.set({ version: SEED_DATA_VERSION, at: Date.now() });
}

const KIND_LABELS = { trailer: 'Trailer', truck: 'Truck', equipment: 'Equipment item', driver: 'Driver' };
function sourceSheetFor(kind) { return kind === 'driver' ? 'the Approved Drivers list' : 'Rolling Stock'; }

// A write-in creates a real, bookable asset (so double-booking and
// back-to-back checks apply to it exactly like anything from Rolling
// Stock/Approved Drivers) but flags it `writeIn: true` so a later reference
// data migration never deletes it as stale seed data. Every write-in shows
// a one-time toast naming the sheet it should be added to.
async function createWriteInAsset(kind, label) {
  const id = 'writein_' + kind + '_' + slugify(label) + '_' + Date.now().toString(36);
  const asset = {
    id, kind, number: '', label, description: '', outOfService: false, writeIn: true,
    ...(kind !== 'driver' ? { category: 'Other' } : {}),
    ...(kind === 'equipment' ? { approvedTrailerIds: [] } : {}),
  };
  if (state.db) {
    try { await state.db.doc('assets/' + id).set(asset); } catch (e) { /* best-effort */ }
  }
  if (!state.assets.find(a => a.id === id)) { state.assets.push(asset); } // optimistic, ahead of the snapshot round trip
  showToast('Added "' + label + '" as a new ' + KIND_LABELS[kind] + '. Update ' + sourceSheetFor(kind) + ' so it stays in sync.');

}

async function saveAssignmentDoc(id, data) {

  else {

async function deleteAssignmentDoc(id) {

// -------------------- Booking / cancellation log --------------------
// One immutable entry per booking event. Labels are snapshotted at write
// time so an entry still reads correctly after an asset is renamed or
// removed. Every write also opportunistically prunes entries beyond the cap
// so the log never grows without bound.
const LOG_CAP = 900;
function labelOf(id) { const a = id ? assetById(id) : null; return a ? a.label : (id ? '(removed)' : '—'); }
async function appendLog(action, asg) {
  const entry = {
    at: Date.now(),
    action, // 'Booked' | 'Updated' | 'Canceled'
    deploymentName: asg.deploymentName || '',
    trailer: labelOf(asg.trailerId),
    truck: labelOf(asg.truckId),
    equipment: asg.equipmentId ? labelOf(asg.equipmentId) : '—',
    driver: labelOf(asg.driverId),
    deployDate: asg.deployDate || '',
    returnDate: asg.returnDate || '',
  };
  const id = 'log_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
  if (state.db) {
    try {
      await state.db.doc('log/' + id).set(entry);
      const over = await state.db.collection('log').orderBy('at', 'desc').limit(1000).get();
      if (over.docs.length > LOG_CAP) {
        const stale = over.docs.slice(LOG_CAP);
        for (const d of stale) { try { await state.db.doc('log/' + d.id).delete(); } catch (e) {} }
      }
    } catch (e) { /* logging is best-effort */ }
  } else {
    state.log.unshift({ id, ...entry });
    state.log = state.log.slice(0, LOG_CAP);
    render();
  }
}

/* -------------------- CSV downloads --------------------
   Page-initiated downloads are blocked in the artifact viewer, so saves go
   through the platform downloads capability: the viewer sees a confirmation
   and can decline (which is a normal outcome, not an error). Buttons only
   render when the capability resolved for this view. */
function csvEscape(v) {
  const s = (v === null || v === undefined) ? '' : String(v);
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function buildScheduleCSV() {
  const today = toISODate(todayDateOnly());
  const header = ['Deployment', 'Category', 'Status', 'Trailer', 'Truck', 'Equipment', 'Driver', 'Departure', 'Return', 'Return Trips', 'Notes'];
  const rows = state.assignments.slice().sort((a, b) => (a.deployDate || '').localeCompare(b.deployDate || ''));
  const lines = [header.join(',')];
  rows.forEach(a => {
    const status = (a.returnDate && a.returnDate < today) ? 'Returned' : ((a.deployDate && a.deployDate <= today) ? 'Deployed' : 'Scheduled');
    const trips = returnTripsOf(a).map(t =>
      returnTripScopeLabel(a, t) + ': ' + (t.driverId ? labelOf(t.driverId) : 'driver TBD') + (t.date ? ' on ' + t.date : ', date TBD')
    ).join('; ');
    lines.push([
      a.deploymentName, categoryForAssignment(a), status,
      labelOf(a.trailerId), labelOf(a.truckId), a.equipmentId ? labelOf(a.equipmentId) : '',
      labelOf(a.driverId), a.deployDate || '', a.returnDate || '',
      trips, a.notes || '',
    ].map(csvEscape).join(','));
  });
  return lines.join('\r\n');
}
function buildLogCSV() {
  const header = ['When', 'Action', 'Deployment', 'Trailer', 'Truck', 'Equipment', 'Driver', 'Departure', 'Return'];
  const lines = [header.join(',')];
  state.log.forEach(e => {
    lines.push([
      new Date(e.at).toLocaleString('en-US'), e.action, e.deploymentName,
      e.trailer, e.truck, e.equipment, e.driver, e.deployDate, e.returnDate,
    ].map(csvEscape).join(','));
  });
  return lines.join('\r\n');
}
// Live per-unit status in Rolling Stock's own vocabulary, ready to paste
// into that sheet's STATUS column: Available / Assigned (booked for a
// future window) / Deployed (out right now) / Out of Service. Transitions
// happen automatically — booking a vehicle makes it Assigned, then
// Deployed once its departure date arrives, and it reverts to Available
// the day after its return date or the moment the booking is canceled.
function buildFleetStatusCSV() {
  const header = ['Unit', 'Type', 'Category', 'Status', 'Deployment', 'Return Date'];
  const KINDS = [['truck', 'Truck'], ['trailer', 'Trailer'], ['equipment', 'Equipment']];
  const lines = [header.join(',')];
  KINDS.forEach(([kind, kindLabel]) => {
    // Unfiltered on purpose: the export mirrors the whole sheet, so Staff
    // vehicles (hidden on the board) still appear here with their status.
    state.assets.filter(a => a.kind === kind)
      .sort((a,b) => a.label.localeCompare(b.label, undefined, {numeric:true}))
      .forEach(a => {
      const st = currentAssetStatus(a);
      const statusWord = st.code === 'oos' ? 'Out of Service'
        : st.code === 'deployed' ? 'Deployed'
        : st.code === 'future' ? 'Assigned'
        // No booking on this board: keep whatever status the Rolling Stock
        // sheet itself carries (Assigned/Deployed set there stays put).
        : (a.sheetStatus || 'Available');
      lines.push([
        a.label, kindLabel, a.category || 'Other', statusWord,
        st.booking ? st.booking.deploymentName : '',
        st.booking ? st.booking.returnDate : '',
      ].map(csvEscape).join(','));
    });
  });
  return lines.join('\r\n');
}

// Manual refresh. Two jobs:
// 1) Re-arm the live subscriptions — a listener in a tab that slept
//    overnight can be dead, and a fresh onSnapshot is the documented
//    recovery. The re-armed listeners repopulate state on their own.
// 2) Direct reads as belt-and-suspenders, applied through the guarded
//    setters above — a degraded read (empty where data must exist) is
//    DISCARDED, never allowed to zero out the screen; the previous
//    refresh-button bug did exactly that.
// Never re-renders over an in-progress New/Edit form — the form reads
// refreshed state live, so nothing typed is lost.
async function manualRefresh(btn) {
  if (btn) { btn.classList.add('spinning'); btn.disabled = true; }
  let healthy = true;
  if (state.db) {
    attachSubscriptions(state.db);
    const [a, s, l] = await Promise.allSettled([
      state.db.collection('assets').get(),
      state.db.collection('assignments').get(),
      state.db.collection('log').orderBy('at', 'desc').limit(500).get(),
    ]);
    const assetsOk = a.status === 'fulfilled' && acceptAssets(a.value.docs);
    if (s.status === 'fulfilled') {
      // If the assets read proved the read path healthy, trust an empty
      // assignments result as real (everything may genuinely be canceled).
      if (assetsOk && s.value.docs.length === 0) state.assignments = [];
      else acceptAssignments(s.value.docs, s.value);
    }
    if (l.status === 'fulfilled') {
      if (assetsOk && l.value.docs.length === 0) state.log = [];
      else acceptLog(l.value.docs, l.value);
    }
    healthy = assetsOk || a.status === 'fulfilled';
  }
  // Pull live statuses from the Rolling Stock sheet too, when this view
  // can reach the viewer's Google Drive connector.
  if (state.mcp) await syncRollingStock();
  if (btn) { btn.classList.remove('spinning'); btn.disabled = false; }
  if (state.route !== 'new' && state.route !== 'edit') render();
  let msg;
  if (!healthy) msg = 'Connection is shaky — showing the last good data. Try again in a moment.';
  else if (state.rsSync.status === 'ok') {
    const n = state.rsSync.changes || 0;
    msg = 'Refreshed. Rolling Stock synced' + (n ? ' — ' + n + ' status change' + (n === 1 ? '' : 's') + '.' : ' — no changes.');
  } else if (state.rsSync.status === 'error') msg = 'Refreshed. ' + state.rsSync.message;
  else msg = 'Refreshed.';
  showToast(msg);
}

/* -------------------- Live Rolling Stock sheet sync -------------------- */
// The Rolling Stock Google Sheet is the source of truth for per-unit
// status. The embedded snapshot above is only the seed/fallback; whenever
// this view can reach the viewer's Google Drive connector, the sheet's
// first tab (Current Rolling Stock) is fetched as CSV and each unit's
// STATUS column is applied to the matching asset — on load and on every
// Refresh — so an edit made in the sheet shows up here without a republish.
const RS_FILE_ID = '1IuyO1B9EBLCY9ckS0mUPEMpzmAF4hgpHGoHScsV8gsM';

// Normalize a sheet STATUS word into a bucket the UI can place. The raw
// word is kept for display (the sheet says "Staff", the pill says Staff).
function sheetBucket(status) {
  const s = String(status || '').trim().toLowerCase();
  if (!s || s === 'available' || s === 'active') return 'available';
  if (s === 'deployed') return 'deployed';
  if (s === 'out of service' || s === 'oos' || s === 'decommissioned' || s.indexOf('dissolved') === 0) return 'oos';
  return 'assigned'; // Staff, Assigned, and anything else non-available
}

// Minimal CSV parser (quoted fields, doubled quotes, CRLF).
function parseCSV(text) {
  const rows = []; let row = [], field = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
      else field += ch;
    } else if (ch === '"') inQ = true;
    else if (ch === ',') { row.push(field); field = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i + 1] === '\n') i++;
      row.push(field); field = ''; rows.push(row); row = [];
    } else field += ch;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function b64ToUtf8(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

// Parse the Current Rolling Stock CSV into {unit -> {status, area, type, desc}}.
function parseRollingStockCSV(csvText) {
  const rows = parseCSV(csvText);
  if (!rows.length) return null;
  const hdr = rows[0].map(c => c.trim().toUpperCase());
  const col = name => hdr.indexOf(name);
  const uc = col('#'), sc = col('STATUS');
  if (uc < 0 || sc < 0) return null; // layout changed beyond recognition — don't guess
  const mc = col('MINISTRY AREA'), tc = col('TYPE'), cc = col('COMMENTS'),
        yc = col('YEAR'), mk = col('MAKE'), md = col('MODEL'),
        hc = col('HITCH'), ec = col('EMPTY WEIGHT'), gc = col('GVWR');
  const cell = (r, i) => (i >= 0 && i < r.length ? String(r[i]).trim() : '');
  const weight = (r, i) => {
    const digits = cell(r, i).replace(/[^0-9]/g, '');
    const n = digits ? parseInt(digits, 10) : 0;
    return n > 100 ? n : null; // ignore junk like "0", "N/A", footnote counts
  };
  const units = {};
  rows.slice(1).forEach(r => {
    const unit = cell(r, uc);
    if (!unit || unit === '#') return;
    units[unit] = {
      status: cell(r, sc), area: cell(r, mc), type: cell(r, tc),
      desc: [ [cell(r, yc), cell(r, mk), cell(r, md)].filter(Boolean).join(' '), cell(r, cc) ].filter(Boolean).join(' — '),
      model: cell(r, md), comments: cell(r, cc),
      hitch: cell(r, hc), ew: weight(r, ec), gvwr: weight(r, gc),
    };
  });
  return Object.keys(units).length ? units : null;
}

function kindForSheetRow(info) {
  const t = (info.type || '').toLowerCase();
  if (t.indexOf('equipment') >= 0) return 'equipment';
  if (t.indexOf('trailer') >= 0) return 'trailer';
  if (t.indexOf('vehicle') >= 0 || t.indexOf('truck') >= 0) return 'truck';
  return 'trailer';
}
function categoryForSheetRow(unit, info) {
  if (/\bRB\b|rebuild/i.test(unit + ' ' + (info.desc || ''))) return 'Rebuild';
  return (info.area || '').trim().toUpperCase() === 'DR' ? 'DR' : 'Other';
}

let rsSyncInFlight = false;
async function syncRollingStock() {
  if (!state.mcp || rsSyncInFlight) return;
  rsSyncInFlight = true;
  try {
    let result;
    try {
      result = await state.mcp.callTool('Google Drive', 'download_file_content',
        { fileId: RS_FILE_ID, exportMimeType: 'text/csv' });
    } catch (e) {
      if (e && e.retryable) {
        await new Promise(r => setTimeout(r, 1200 + Math.random() * 800));
        result = await state.mcp.callTool('Google Drive', 'download_file_content',
          { fileId: RS_FILE_ID, exportMimeType: 'text/csv' });
      } else throw e;
    }
    let payload = result && result.payload;
    if (typeof payload === 'string') { try { payload = JSON.parse(payload); } catch (e) { payload = null; } }
    const b64 = payload && payload.content;
    const units = b64 ? parseRollingStockCSV(b64ToUtf8(b64)) : null;
    if (!units) throw { code: 'parse', message: 'Unexpected sheet layout' };

    // Apply to matching assets; add units the board has never seen.
    const bySlug = {};
    state.assets.forEach(a => { if (a.kind !== 'driver') bySlug[slugify(a.label)] = a; });
    const changed = [];
    Object.keys(units).forEach(unit => {
      const info = units[unit];
      const raw = info.status || 'Available';
      const existing = bySlug[slugify(unit)];
      if (existing) {
        const oos = sheetBucket(raw) === 'oos';
        const hitch = info.hitch || '';
        const gnCap = existing.kind === 'truck' ? /gooseneck|goose neck|\bgn\b/i.test(hitch) : undefined;
        if (existing.sheetStatus !== raw || existing.outOfService !== oos || existing.statusSource === 'board' ||
            existing.hitchType !== hitch || existing.emptyWeight !== (info.ew || null) || existing.gvwr !== (info.gvwr || null) ||
            existing.model !== (info.model || '') || existing.comments !== (info.comments || '') ||
            (gnCap !== undefined && existing.gooseneckCapable !== gnCap)) {
          existing.sheetStatus = raw;
          existing.outOfService = oos;
          existing.statusSource = 'sheet';
          existing.hitchType = hitch;
          existing.emptyWeight = info.ew || null;
          existing.gvwr = info.gvwr || null;
          existing.model = info.model || '';
          existing.comments = info.comments || '';
          if (gnCap !== undefined) existing.gooseneckCapable = gnCap;
          changed.push(existing); // in-memory object keeps any verified towCapacity
        }
      } else {
        const kind = kindForSheetRow(info);
        const added = {
          id: kind + '_' + slugify(unit), kind, number: unit, label: unit,
          description: info.desc || '', category: categoryForSheetRow(unit, info),
          outOfService: sheetBucket(raw) === 'oos', sheetStatus: raw, synced: true,
          model: info.model || '', comments: info.comments || '',
          hitchType: info.hitch || '', emptyWeight: info.ew || null, gvwr: info.gvwr || null,
          ...(kind === 'truck' ? { gooseneckCapable: /gooseneck|goose neck|\bgn\b/i.test(info.hitch || ''), towCapacity: null } : {}),
          ...(kind === 'equipment' ? { approvedTrailerIds: [] } : {}),
        };
        state.assets.push(added);
        changed.push(added);
      }
    });
    if (state.db && changed.length) {
      await writeInBatches(changed, a => state.db.doc('assets/' + a.id).set(a));
    }
    state.rsSync = { status: 'ok', at: Date.now(), message: null, changes: changed.length };
  } catch (e) {
    const code = e && e.code;
    const msg = code === 'server_not_connected' ? 'Google Drive isn’t connected in this view — add it in claude.ai Settings → Connectors to sync Rolling Stock.'
      : code === 'needs_reauth' ? 'Reconnect Google Drive in claude.ai Settings → Connectors to sync Rolling Stock.'
      : code === 'selection_required' ? 'Choose a Google Drive connector when prompted, then press Refresh.'
      : code === 'not_granted' || code === 'blocked_by_policy' || code === 'approval_required' ? 'This view doesn’t have access to Google Drive — statuses shown are from the last sync.'
      : 'Couldn’t reach the Rolling Stock sheet — statuses shown are from the last sync.';
    state.rsSync = { status: 'error', at: state.rsSync.at, message: msg };
  } finally {
    rsSyncInFlight = false;
  }
  if (state.route !== 'new' && state.route !== 'edit') render();
}

async function downloadCSV(filename, csv) {
  if (!state.downloads) return;
  try {
    await state.downloads.save({ filename, data: csv });
    showToast('Downloaded ' + filename + '.');
  } catch (e) {
    if (e && e.code === 'declined') return;            // viewer said no — that's fine
    if (e && e.code === 'rate_limited') { showToast('A download prompt is already open — try again in a moment.'); return; }
    showToast('Download isn’t available right now.');
  }
}
function downloadButton(label, handler) {
  if (!state.downloads) return null;

  btn.innerHTML = icon('download', 15) + '<span>' + label + '</span>';

  return btn;
}

/* =====================================================================
   DOMAIN LOGIC
   ===================================================================== */
function assetById(id) { return state.assets.find(a => a.id === id) || null; }

function assignmentsForAsset(assetId, excludeAssignmentId) {
  return state.assignments.filter(a =>
    excludeAssignmentId !== a.id &&
    (a.trailerId === assetId || a.truckId === assetId || a.equipmentId === assetId || a.driverId === assetId)
  );
}

/* ---- Return trips ----
   Every assignment carries at least one return trip. When the trailer or
   the equipment is checked to REMAIN ON SCENE, the single return splits
   into two separate returns — one for the trailer, one for the equipment —
   each with its own driver and date, assignable later. With nothing
   checked there is one return covering everything, as before. Older docs
   carry a flat returnDriverId/returnTripDate pair; normalize them here. */
function returnTripsOf(a) {
  if (Array.isArray(a.returnTrips) && a.returnTrips.length) return a.returnTrips;
  return [{ scope: 'all', driverId: a.returnDriverId || null, date: a.returnTripDate || '' }];
}
function returnTripScopeLabel(a, t) {
  if (t.scope === 'trailer') return 'Trailer ' + labelOf(a.trailerId);
  if (t.scope === 'equipment') return 'Equipment ' + (a.equipmentId ? labelOf(a.equipmentId) : '');
  return 'Full Return';
}
// The split happens only when there's actually equipment to separate from
// the trailer; a lone trailer's return already covers everything.
function activeReturnScopes(blk) {
  return ((blk.trailerRemains || blk.equipmentRemains) && blk.equipmentId) ? ['trailer', 'equipment'] : ['all'];
}

// Check a due return in: record the returning assets' condition (Available
// or Out of Service), stamp the trip as checked in, update each asset's
// status, and log it. The chosen status applies to the returning cargo —
// the trailer and/or equipment in the trip's scope; the truck's own
// availability already follows the booking window.
function returnAssetsForScope(a, scope) {
  if (scope === 'trailer') return [a.trailerId].filter(Boolean);
  if (scope === 'equipment') return [a.equipmentId].filter(Boolean);
  return [a.trailerId, a.equipmentId].filter(Boolean);
}
async function checkInReturn(a, scope, statusWord) {
  const trips = returnTripsOf(a).map(t => Object.assign({}, t));
  const trip = trips.find(t => t.scope === scope);
  if (!trip) return;
  trip.checkedIn = { status: statusWord, at: Date.now() };
  const oos = statusWord === 'Out of Service';
  const assetIds = returnAssetsForScope(a, scope);
  const names = [];
  for (const id of assetIds) {
    const asset = assetById(id);
    if (!asset) continue;
    asset.outOfService = oos;
    asset.sheetStatus = statusWord;
    asset.statusSource = 'board'; // set here, not read from the sheet
    names.push(asset.label);
    if (state.db) { try { await state.db.doc('assets/' + id).set(asset); } catch (e) {} }
  }
  const updated = Object.assign({}, a, { returnTrips: trips });
  delete updated.id;
  await saveAssignmentDoc(a.id, updated);
  const idx = state.assignments.findIndex(x => x.id === a.id);
  if (idx >= 0) state.assignments[idx] = Object.assign({ id: a.id }, updated);
  appendLog('Returned', Object.assign({}, updated, {
    deploymentName: (a.deploymentName || '') + ' — checked in ' + statusWord,
    driverId: trip.driverId, deployDate: trip.date || a.returnDate, returnDate: trip.date || a.returnDate,
  }));
  showToast(names.join(', ') + ' checked in as ' + statusWord + '. Update Rolling Stock (or download Fleet Status) so the sheet matches.');
  render();
}

/* ---- Towing capacity & CDL-A control ----
   Capacity hierarchy: (1) TXM-verified per-vehicle tow capacity entered on
   this board, (2..3) VIN/manufacturer ratings live outside this system —
   enter them as the verified value, (4) TXM conservative class default.
   Never assume a truck has the manufacturer's maximum advertised rating. */
const TXM_CLASS_TOW_DEFAULTS = { '3q': 15000, 'srw1ton': 18000, 'drw': 20000 };
// Conservative GVWR estimates used ONLY for the CDL-A combination check
// when the sheet has no GVWR for the truck — erring heavy, never light.
const TXM_CLASS_GVWR_ESTIMATES = { '3q': 10000, 'srw1ton': 11500, 'drw': 14000, 'hdplus': 19500 };

function truckClassOf(truck) {
  const t = ((truck.label || '') + ' ' + (truck.description || '')).toLowerCase();
  if (/\b(4500|5500|f-?450|f-?550)\b/.test(t)) return 'hdplus';
  if (/dually|\bdrw\b/.test(t)) return 'drw';
  if (/\b(3500|f-?350)\b/.test(t)) return 'srw1ton';
  if (/\b(2500|f-?250)\b/.test(t)) return '3q';
  return 'light'; // light-duty pickup / SUV / van — vehicle-specific rating required
}
function truckClassWord(cls) {
  return cls === 'hdplus' ? 'F-450/4500-class and above' : cls === 'drw' ? '1-ton dually'
    : cls === 'srw1ton' ? '1-ton single-wheel' : cls === '3q' ? '3/4-ton HD' : 'light-duty';
}
// {value, source} — source: 'verified' | 'default' | null (rating required)
function towCapacityOf(truck) {
  if (!truck) return { value: null, source: null };
  if (truck.towCapacity) return { value: truck.towCapacity, source: 'verified' };
  const dflt = TXM_CLASS_TOW_DEFAULTS[truckClassOf(truck)];
  return dflt ? { value: dflt, source: 'default' } : { value: null, source: null };
}
function truckGvwrOf(truck) {
  if (!truck) return { value: null, provisional: false };
  if (truck.gvwr) return { value: truck.gvwr, provisional: false };
  const est = TXM_CLASS_GVWR_ESTIMATES[truckClassOf(truck)];
  return est ? { value: est, provisional: true } : { value: null, provisional: false };
}
// Gooseneck-class trailers (gooseneck / GN / fifth wheel / kingpin) may
// only pair with vehicles documented gooseneck-capable — never on bumper
// capacity alone.
function isGooseneckTrailer(trailer) {
  if (!trailer) return false;
  const t = ((trailer.hitchType || '') + ' ' + (trailer.description || '')).toLowerCase();
  return /gooseneck|goose neck|\bgn\b|fifth wheel|kingpin/.test(t);
}
// {value, source: 'entered'|'gvwr'|null} — never assume an unknown trailer is empty.
function trailerWeightOf(trailer, enteredLoadedWeight) {
  if (enteredLoadedWeight) return { value: enteredLoadedWeight, source: 'entered' };
  if (trailer && trailer.gvwr) return { value: trailer.gvwr, source: 'gvwr' };
  return { value: null, source: null };
}
function fmtLb(n) { return n == null ? '—' : n.toLocaleString('en-US') + ' lb'; }

// Full compatibility read for a proposed truck+trailer pairing.
// status: 'green' | 'yellow' | 'red' (+ reasons), reserve, CDL data.
function towCompatFor(trailer, truck, enteredLoadedWeight) {
  const out = { status: null, reasons: [], reserve: null, cap: null, weight: null,
                cdlRequired: false, combined: null, combinedProvisional: false, gooseneck: false };
  if (!trailer || !truck) return out;
  out.gooseneck = isGooseneckTrailer(trailer);
  const cap = towCapacityOf(truck);
  const wt = trailerWeightOf(trailer, enteredLoadedWeight);
  out.cap = cap; out.weight = wt;
  if (out.gooseneck && !truck.gooseneckCapable) {
    out.status = 'red';
    out.reasons.push(truck.label + ' is not documented gooseneck/fifth-wheel capable — ' + trailer.label + ' requires a gooseneck hitch.');
  }
  if (cap.value != null && wt.value != null) {
    out.reserve = cap.value - wt.value;
    if (out.reserve < 0 && out.status !== 'red') {
      out.status = 'red';
      out.reasons.push(trailer.label + ' at ' + fmtLb(wt.value) + ' exceeds ' + truck.label + '’s ' + (cap.source === 'verified' ? 'verified' : 'TXM default') + ' capacity of ' + fmtLb(cap.value) + '.');
    } else if (out.reserve < 0) {
      out.reasons.push('Weight also exceeds capacity by ' + fmtLb(-out.reserve) + '.');
    }
  }
  if (out.status !== 'red') {
    if (cap.value == null) { out.status = 'yellow'; out.reasons.push('No verified tow capacity for ' + truck.label + ' (' + truckClassWord(truckClassOf(truck)) + ' — vehicle-specific rating required).'); }
    if (wt.value == null) { out.status = 'yellow'; out.reasons.push('No loaded weight or GVWR on file for ' + trailer.label + ' — enter the actual loaded weight.'); }
    if (!out.status) out.status = 'green';
  }
  // CDL-A: rated combination weight (GVWR + GVWR), never bypassed by the
  // actual load carried today.
  const tg = truckGvwrOf(truck);
  if (tg.value != null && trailer.gvwr != null) {
    out.combined = tg.value + trailer.gvwr;
    out.combinedProvisional = tg.provisional;
    if (out.combined >= 26000) out.cdlRequired = true;
  }
  return out;
}
function isCdlA(driver) {
  if (!driver) return false;
  const cls = (driver.cls != null ? driver.cls : (String(driver.description || '').match(/License Class (\S+)/) || [])[1] || '').toUpperCase();
  return cls.indexOf('A') === 0;
}
function cdlStatusForAssignment(a) {
  if (!a || !a.cdlRequired) return null;
  const driver = a.driverId ? assetById(a.driverId) : null;
  return { required: true, satisfied: !!(driver && isCdlA(driver)), combined: a.combinedGvwr || null };
}
function cdlBadgeEl(a) {
  const st = cdlStatusForAssignment(a);
  if (!st) return null;
  if (st.satisfied) return el('span', { class: 'cdl-badge ok' }, ['CDL-A ✓']);
  return el('span', { class: 'cdl-badge req' }, ['CDL-A REQUIRED']);
}

// Overall current status for dashboard/list display (no specific date window in mind)
function currentAssetStatus(asset) {
  if (asset.kind === 'driver') {
    if (asset.outOfService) return { code: 'oos', label: 'Unavailable' };
  } else if (asset.outOfService) {
    return { code: 'oos', label: 'Out of Service' };
  }
  const today = toISODate(todayDateOnly());
  const bookings = assignmentsForAsset(asset.id, null);
  const active = bookings.find(a => a.deployDate <= today && today <= a.returnDate);
  if (active) return { code: 'deployed', label: asset.kind === 'driver' ? 'Assigned' : 'Deployed', booking: active };
  const future = bookings.filter(a => a.deployDate > today).sort((a,b) => a.deployDate.localeCompare(b.deployDate))[0];
  if (future) return { code: 'future', label: 'Future Booking', booking: future };
  return { code: 'available', label: 'Available' };
}

// Status relative to a specific candidate date range (used while building/editing an assignment)
function statusForCandidateWindow(asset, deployDate, returnDate, excludeAssignmentId) {
  if (asset.outOfService) return { code: 'oos', label: 'OUT OF SERVICE', blocking: true };
  const bookings = assignmentsForAsset(asset.id, excludeAssignmentId);
  if (deployDate && returnDate) {
    const conflict = bookings.find(a => overlapsISO(deployDate, returnDate, a.deployDate, a.returnDate));
    if (conflict) {
      return { code: 'conflict', label: 'BOOKED — ' + conflict.deploymentName + ' — Returns ' + fmtShort(conflict.returnDate), blocking: true, booking: conflict };
    }
    return { code: 'available', label: 'Available', blocking: false };
  }
  // no dates chosen yet: show current status as context, never blocking
  const today = toISODate(todayDateOnly());
  const active = bookings.find(a => a.deployDate <= today && today <= a.returnDate);
  if (active) return { code: 'info', label: 'BOOKED — ' + active.deploymentName + ' — Returns ' + fmtShort(active.returnDate), blocking: false, booking: active };
  const future = bookings.filter(a => a.deployDate > today).sort((a,b)=>a.deployDate.localeCompare(b.deployDate))[0];
  if (future) return { code: 'info', label: 'BOOKED ' + fmtShort(future.deployDate) + ' — ' + future.deploymentName, blocking: false, booking: future };
  return { code: 'available', label: 'Available', blocking: false };
}

function hardConflictsFor(asset, deployDate, returnDate, excludeAssignmentId) {
  if (!asset) return [];
  if (asset.outOfService) return [{ type: 'oos' }];
  const bookings = assignmentsForAsset(asset.id, excludeAssignmentId);
  return bookings.filter(a => overlapsISO(deployDate, returnDate, a.deployDate, a.returnDate)).map(b => ({ type: 'overlap', booking: b }));
}

// Back-to-back: gap of 0 or 1 day on either side, excluding true overlaps (those are hard stops already)
function backToBackWarningsFor(asset, deployDate, returnDate, excludeAssignmentId) {
  if (!asset || asset.outOfService) return [];
  const bookings = assignmentsForAsset(asset.id, excludeAssignmentId);
  const warns = [];
  bookings.forEach(b => {
    if (overlapsISO(deployDate, returnDate, b.deployDate, b.returnDate)) return; // real conflict, handled elsewhere
    const gapAfterB = daysBetweenISO(b.returnDate, deployDate);   // b returns, then this deploys
    const gapBeforeB = daysBetweenISO(returnDate, b.deployDate);  // this returns, then b deploys
    if (gapAfterB >= 0 && gapAfterB <= 1) warns.push({ direction: 'after', gap: gapAfterB, booking: b });
    else if (gapBeforeB >= 0 && gapBeforeB <= 1) warns.push({ direction: 'before', gap: gapBeforeB, booking: b });
  });
  return warns;
}

// Vehicles the Rolling Stock sheet marks "Staff" are personal daily
// drivers, not dispatchable fleet — they're kept off the board entirely
// (no dashboard listing, no dropdowns). They come back automatically the
// moment the sheet's status changes to anything else.
function isStaffAsset(a) { return String(a.sheetStatus || '').trim().toLowerCase() === 'staff'; }
function assetsOfKind(kind) { return state.assets.filter(a => a.kind === kind && !isStaffAsset(a)).sort((a,b) => a.label.localeCompare(b.label, undefined, {numeric:true})); }

/* =====================================================================
   RENDER HELPERS
   ===================================================================== */
function el(tag, attrs, children) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === 'class') e.className = attrs[k];
    else if (k === 'html') e.innerHTML = attrs[k];
    else if (k.startsWith('on') && typeof attrs[k] === 'function') e.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== null && attrs[k] !== undefined) e.setAttribute(k, attrs[k]);
  }
  (children || []).forEach(c => { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return e;
}
function icon(name, size) {

function pillHTML(status) {

/* =====================================================================
   SEARCHABLE COMBO COMPONENT
   getOptions(query) -> [{id, primary, secondary, badge, disabled, disabledReason, footnote}]
   ===================================================================== */
function mountCombo(container, opts) {
  // opts: { value, placeholder, getOptions(query), onSelect(id|null), renderChosen(id) }
  //
  // Two race conditions live here and both are guarded:
  //
  // 1) Selecting an option calls onSelect, which (every caller here)
  //    re-invokes mountCombo on this same container to reflect the new
  //    value — a NEWER instance takes over mid-click. The ORIGINAL
  //    instance's own trailing close()/paint() must become a no-op, or it
  //    repaints last using its stale captured opts.value and the
  //    just-made selection visually reverts to empty. A token on the
  //    container marks which instance is current; every render path
  //    checks it first.
  // 2) Within ONE instance, paint() re-renders on every keystroke while
  //    filtering. An outside-click listener used to be re-registered on
  //    every paint() without removing the previous one — so after a few
  //    keystrokes, several stale listeners were stacked on `document`,
  //    each closing over an already-replaced `wrap` element. A real
  //    mousedown on an option (which does NOT contain that old, detached
  //    wrap) would make a stale listener fire and close the panel mid
  //    mousedown — before the click event that follows ever reached the
  //    option, silently swallowing the selection. Fixed by keeping exactly
  //    one listener per instance, attached only while open, reading the
  //    CURRENT wrap through a shared variable instead of a snapshot.
  const myToken = {};
  container._comboToken = myToken;
  function isCurrent() { return container._comboToken === myToken; }
  let open = false, query = '', hiIndex = -1, currentOptions = [];
  let liveWrap = null;
  let outsideAttached = false;

  function outsideMousedown(ev) {
    if (!isCurrent()) { document.removeEventListener('mousedown', outsideMousedown); outsideAttached = false; return; }
    if (liveWrap && !liveWrap.contains(ev.target)) close();
  }

  function close() {
    if (!isCurrent()) return;
    open = false; query = ''; hiIndex = -1;
    if (outsideAttached) { document.removeEventListener('mousedown', outsideMousedown); outsideAttached = false; }
    paint();
  }

  // Shared by the click and Enter-key paths. A write-in option has to
  // create its asset first (async — a db write when db is available) before
  // it has an id to select, so this is async even though the plain-option
  // path resolves immediately.
  async function selectOption(o) {
    if (o.disabled) return;
    if (o.isWriteIn) {
      const newId = await opts.onCreateWriteIn(o.writeInLabel);
      if (newId) opts.onSelect(newId);
    } else {
      opts.onSelect(o.id);
    }
    close();
  }

  function paint() {
    if (!isCurrent()) return;
    container.innerHTML = '';
    const wrap = el('div', { class: 'combo' });
    const inputRow = el('div', { class: 'combo-input' + (open ? ' open' : '') });

    if (opts.value && !open) {
      const chosen = opts.renderChosen(opts.value);
      inputRow.appendChild(el('span', { class: 'chosen-pill', style: 'flex:1; color:var(--ink); font-weight:600;' }, [chosen]));
      const clearBtn = el('button', { class: 'clear-btn', type: 'button', 'aria-label': 'Clear selection', onclick: (e) => { e.stopPropagation(); opts.onSelect(null); } });
      clearBtn.innerHTML = icon('x', 15);
      inputRow.appendChild(clearBtn);
      inputRow.addEventListener('click', () => { open = true; query=''; paint(); const inp = container.querySelector('input'); if (inp) inp.focus(); });
    } else {
      const input = el('input', {
        type: 'text',
        placeholder: opts.placeholder || 'Search…',
        value: query,
        oninput: (e) => { query = e.target.value; hiIndex = -1; paint(); const i = container.querySelector('input'); if (i) { i.focus(); i.selectionStart = i.selectionEnd = i.value.length; } },
        onfocus: () => { if (!open) { open = true; paint(); } },
        onkeydown: (e) => {
          if (e.key === 'Escape') { close(); }
          else if (e.key === 'ArrowDown') { e.preventDefault(); hiIndex = Math.min(hiIndex+1, currentOptions.length-1); paint(); }
          else if (e.key === 'ArrowUp') { e.preventDefault(); hiIndex = Math.max(hiIndex-1, 0); paint(); }
          else if (e.key === 'Enter') { e.preventDefault(); const o = currentOptions[hiIndex]; if (o && !o.disabled) selectOption(o); }
        },
      });
      inputRow.appendChild(input);
      if (!open) inputRow.addEventListener('click', () => { open = true; paint(); setTimeout(()=>{ const i = container.querySelector('input'); if (i) i.focus(); },0); });
    }
    wrap.appendChild(inputRow);

    if (open) {
      const panel = el('div', { class: 'combo-panel' });
      currentOptions = opts.getOptions(query);
      if (currentOptions.length === 0) {
        panel.appendChild(el('div', { class: 'combo-empty' }, ['No available matches.']));
      } else {
        currentOptions.forEach((o, i) => {
          const row = el('div', { class: 'combo-opt' + (o.disabled ? ' disabled' : '') + (i === hiIndex ? ' hi' : '') + (o.isWriteIn ? ' writein' : '') });
          const left = el('div', { class: 'left' });
          left.appendChild(el('div', { class: 'name' }, [o.primary]));
          if (o.secondary) left.appendChild(el('div', { class: 'meta' }, [o.secondary]));
          row.appendChild(left);
          if (o.badge) row.appendChild(el('span', { class: 'badge' }, [o.badge]));
          if (!o.disabled) {
            row.addEventListener('click', () => { selectOption(o); });
          }
          panel.appendChild(row);
        });
      }
      wrap.appendChild(panel);
    }
    container.appendChild(wrap);
    liveWrap = wrap;
    if (open && !outsideAttached) {
      outsideAttached = true;
      // Deferred one tick so the click that opened the combo isn't itself seen as "outside".
      setTimeout(() => { if (isCurrent() && open) document.addEventListener('mousedown', outsideMousedown); }, 0);
    }
  }
  paint();
}

/* Clickable vehicle filters for the scheduling form. Each filter matches
   keywords in a unit's label + description straight from Rolling Stock, so
   tagging follows the sheet's own wording (fix a description there and the
   filters follow). OR semantics across clicked chips; none clicked = all
   available vehicles are shown. */
const VEHICLE_FILTERS = {
  truck: [
    { key: 'cargo',    label: 'Cargo',            re: /\bvan\b|sprinter|\bcargo\b/ },
    { key: 'shortbed', label: 'Short Bed',        re: /short\s*(bed|box)/ },
    { key: 'longbed',  label: 'Long Bed',         re: /long\s*(bed|box)/ },
    { key: 'flatbed',  label: 'Flat Bed',         re: /flat\s*bed/ },
    { key: 'pax',      label: 'Passengers > 4',   re: /\bvan\b|\bsuv\b|tahoe|acadia|motor home|crew\s*cab|\b[5-9][\s-]*(person|passenger|pax)\b/, not: /box/ },
    { key: 'dually',   label: 'Dually',           re: /dually|\bdrw\b/ },
    { key: 'boxtruck', label: 'Box Truck',        re: /box\s*truck/ },
  ],
  trailer: [
    { key: 'shower',   label: 'Shower/Laundry',      re: /shower|laundry/ },
    { key: 'electron', label: 'Electronic',          re: /electronic|electrionic/ },
    { key: 'elecsup',  label: 'Electrical Support',  re: /electrical/ },
    { key: 'chainsaw', label: 'Chainsaw',            re: /chain\s*saw/ },
    { key: 'firerec',  label: 'Fire/Flood Recovery', re: /\bfire\b|flood|mud\s*-?out|ash\s*-?out|recovery/ },
    { key: 'feeding',  label: 'Feeding',             re: /feeding|kitchen|cooking|\bfood\b|cambro/ },
  ],
};
function assetMatchesFilter(asset, def) {
  const text = ((asset.label || '') + ' ' + (asset.description || '')).toLowerCase();
  return def.re.test(text) && !(def.not && def.not.test(text));
}

/* Build combo option list for an asset kind, aware of chosen dates + equipment approval */
function comboOptionsFor(kind, query, ctx) {
  let list = assetsOfKind(kind);
  // Clicked filter chips narrow the list (OR across chips); none = show all.
  if (ctx.filters && ctx.filters.size && VEHICLE_FILTERS[kind]) {
    const active = VEHICLE_FILTERS[kind].filter(d => ctx.filters.has(d.key));
    if (active.length) list = list.filter(a => active.some(d => assetMatchesFilter(a, d)));
  }
  // Gooseneck pairing: a gooseneck/fifth-wheel trailer only offers trucks
  // documented gooseneck-capable (never on bumper capacity alone), ordered
  // dually > 1-ton single-wheel > 3/4-ton, flatbeds first within a class.
  // Symmetrically, a non-gooseneck-capable truck hides gooseneck trailers.
  let gnOrder = null;
  if (kind === 'truck' && ctx.selectedTrailerId) {
    const tr = assetById(ctx.selectedTrailerId);
    if (isGooseneckTrailer(tr)) {
      list = list.filter(t => t.gooseneckCapable);
      const CLASS_RANK = { drw: 0, srw1ton: 1, '3q': 2, hdplus: 3, light: 4 };
      gnOrder = t => (CLASS_RANK[truckClassOf(t)] * 2) + (/flat\s*bed/i.test(t.description || '') ? 0 : 1);
    }
  }
  if (kind === 'trailer' && ctx.selectedTruckId) {
    const tk = assetById(ctx.selectedTruckId);
    if (tk && tk.kind === 'truck' && !tk.gooseneckCapable) list = list.filter(tr => !isGooseneckTrailer(tr));
  }
  // CDL-A restricted assignment: only drivers on file as Class A.
  if (kind === 'driver' && ctx.cdlRequired) list = list.filter(isCdlA);
  const q = (query || '').trim().toLowerCase();
  if (q) {
    list = list.filter(a =>
      a.label.toLowerCase().includes(q) ||
      (a.description || '').toLowerCase().includes(q) ||
      (a.number || '').toLowerCase().includes(q)
    );
  }
  const approvedSet = (kind === 'trailer' && ctx.equipmentId)
    ? new Set((assetById(ctx.equipmentId) || {}).approvedTrailerIds || [])
    : null;

  const opts = list
    .map(a => {
      const st = statusForCandidateWindow(a, ctx.deployDate, ctx.returnDate, ctx.excludeAssignmentId);
      let badge = null;
      if (approvedSet) badge = approvedSet.has(a.id) ? 'Approved' : null;
      return {
        id: a.id,
        primary: a.label,
        secondary: assetSubtext(a),
        badge,
        disabled: st.blocking,
        _approved: approvedSet ? approvedSet.has(a.id) : null,
      };
    })
    // Only available resources are shown here — anything Out of Service, or
    // booked over the dates chosen for this assignment, is left off the
    // list entirely rather than shown disabled.
    .filter(o => !o.disabled);

  if (approvedSet) {
    opts.sort((a,b) => (b._approved - a._approved) || a.primary.localeCompare(b.primary, undefined, {numeric:true}));
  }
  if (gnOrder) {
    const rank = {};
    list.forEach(a => { rank[a.id] = gnOrder(a); });
    opts.sort((a,b) => (rank[a.id] - rank[b.id]) || a.primary.localeCompare(b.primary, undefined, {numeric:true}));
    opts.forEach(o => { if (!o.badge) o.badge = 'GN capable'; });
  }

  // Write-in: if what's typed doesn't exactly match anything on file (found
  // or not — an unavailable exact match still counts, so this never offers
  // a duplicate of something merely booked elsewhere), offer to add it as a
  // new asset rather than requiring everything to already be in Rolling
  // Stock / Approved Drivers before it can be booked.
  const trimmed = (query || '').trim();
  // No driver write-ins on a CDL-A restricted assignment — an unknown CDL
  // status never qualifies.
  if (trimmed && !(kind === 'driver' && ctx.cdlRequired)) {
    const existsExact = list.some(a => a.label.toLowerCase() === trimmed.toLowerCase())
      // Checked against ALL assets of the kind — Staff vehicles included,
      // even though they're hidden from the list — so typing a staff
      // unit's number never creates a bookable duplicate of it.
      || state.assets.some(a => a.kind === kind && a.label.toLowerCase() === trimmed.toLowerCase());
    if (!existsExact) {
      opts.push({
        id: null, isWriteIn: true, writeInLabel: trimmed,
        primary: 'Use "' + trimmed + '"',
        secondary: 'Not on file yet — adds it as a new ' + KIND_LABELS[kind].toLowerCase(),
        badge: null, disabled: false,
      });
    }
  }
  return opts;
}

// Vehicle/trailer/equipment rows read "# — Model — Comments" (drivers keep
// their license-class line); description is the fallback for write-ins and
// anything the sheet has no model/comments for.
function assetSubtext(a) {
  if (a.kind === 'driver') return a.description || '';
  const mc = [a.model, a.comments].filter(Boolean).join(' — ');
  return mc || a.description || '';
}
function chosenLabel(kind, id) {
  const a = assetById(id);
  if (!a) return '';
  const sub = assetSubtext(a);
  return a.label + (sub ? ' — ' + sub : '');
}
